# Dependency cooldown security policy for `dep-cooldown` (see
# src/bin/dep_cooldown/main.rs, scripts/gate.sh, .github/workflows/audit.yml).
#
# A freshly published crate version is exactly the moment a supply-chain
# compromise (a stolen publish token, a hijacked maintainer account) is most
# likely to slip through unnoticed — RustSec/crates.io typically catch and
# yank a malicious release within days, not hours. This policy fails the gate
# on any crates.io dependency in Cargo.lock whose currently-locked version was
# published more recently than `cooldown_days`, unless explicitly allow-listed
# below.

# Commented out rather than set to 4: the tool's own built-in default
# (DEFAULT_COOLDOWN_DAYS in src/bin/dep_cooldown/policy.rs) is already 4, and
# leaving this unset avoids two sources of truth for the same number that
# could silently drift apart. Uncomment to actually override the default.
# cooldown_days = 4

# Scoped, expiring exceptions for a version that genuinely needs to land
# before it clears the window (e.g. an urgent RUSTSEC fix) — mirrors
# deny.toml's `[advisories] ignore` convention: name each exception
# explicitly and say why, never blanket-disable the check. Matches by exact
# version only, so allow-listing today's release does not exempt tomorrow's.
#
# [[allow]]
# name = "example-crate"
# version = "1.2.3"
# reason = "RUSTSEC-XXXX-XXXX fix, reviewed manually YYYY-MM-DD"
