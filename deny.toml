# Supply-chain policy for `cargo-deny`. Complements audit.yml's `cargo-audit`
# (RUSTSEC advisories) with the dimensions audit does not cover: license
# governance, banned/wildcard crates, duplicate versions, and dependency
# sources. Like audit.yml this is an advisory-quality gate — deliberately NOT a
# required check — so a freshly published advisory or a new transitive duplicate
# never blocks an unrelated feature PR; it surfaces on the schedule / dep change.
#
# Evidence basis: every allowed license below is present in the locked graph
# (`cargo deny list`, 285 crates). The set is permissive-only. The single
# copyleft id seen (LGPL-2.1-or-later, via the UEFI-only `r-efi`) is one branch
# of that crate's `MIT OR Apache-2.0 OR LGPL-2.1-or-later` expression, satisfied
# here by MIT/Apache — no strong-copyleft code is linked on any target.

[graph]
# Evaluate the policy over the full feature set the binary can build with.
all-features = true

[licenses]
version = 2
# Permissive / OSI-approved licenses covering 100% of the locked graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Require a high SPDX-detection confidence before accepting a license file.
confidence-threshold = 0.9

[licenses.private]
# huntsman-search-engine itself (`publish = false`) carries a bespoke
# proprietary LICENSE, not an SPDX-catalogued text — cargo-deny's confidence
# scorer correctly can't match it to any known license template (score 0.29),
# so it was flagged `unlicensed` and failing this check on every run. That's a
# false positive on our own unpublished crate, not a real supply-chain gap:
# `confidence-threshold` above exists to police THIRD-PARTY dependency
# licensing, which this crate is not. `ignore = true` here skips license
# scanning for crates that are not published to a registry (per `publish` in
# Cargo.toml), which is exactly this crate and nothing else in the graph.
ignore = true

[bans]
# A 285-crate graph carries a few benign duplicate versions (e.g. thiserror
# 1.x/2.x during the ecosystem migration); surface them without failing. An
# outright wildcard ("*") version requirement is a real hygiene smell — warn.
multiple-versions = "warn"
wildcards = "warn"

[advisories]
version = 2
# `cargo-audit` (audit.yml) is the primary, deny-level advisory gate; this is a
# second, config-versioned view over the same RustSec DB. A yanked release in
# the locked graph is a concrete, actionable supply-chain signal — fail on it.
yanked = "deny"
# Acknowledged, no-fix-available transitive advisories go here. Empty: the one
# prior entry (RUSTSEC-2025-0134, rustls-pemfile — unmaintained, pulled in only
# transitively by reqwest 0.12) was removed once a `cargo update` (2026-07-21)
# migrated reqwest off rustls-pemfile entirely (now rustls-pki-types); the crate
# no longer appears in Cargo.lock at all, so the advisory can't fire.
ignore = []

[sources]
# Only the public crates.io registry may supply dependencies. Blocks an
# unreviewed git or alternate-registry crate from silently entering the graph.
unknown-registry = "deny"
unknown-git = "deny"
