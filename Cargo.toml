# Reconstructed huntsman. The root package builds the huntsman-recon binaries. The workspace
# adds the xtask automation crate and the four async engine crates under crates/, which the
# root package does not depend on.
[workspace]
members = ["xtask", "crates/huntsman-core", "crates/huntsman-storage", "crates/huntsman-collectors", "crates/huntsman-pipeline"]
resolver = "3"

# Blocking HTTP via ureq (rustls). No async runtime. Pure logic stays dependency-free.
# sha256 is in-tree so the evidence hash does not need a crate.

[package]
name = "huntsman-recon"
default-run = "huntsman-recon"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "RCVF ledger with identity, GEOINT, STIX, and Navigator gates and a guarded fetch layer"

# Each runtime dependency states its purpose here; tests/manifest_policy.rs refuses one that does not.
[dependencies]
# Derive serialisation for the ledger, session, STIX and Navigator records.
serde = { version = "1.0", features = ["derive"] }
# JSON for records, API responses and the embedded web API.
serde_json = "1.0"
# Derive Display and Error for the typed error enum.
thiserror = "2.0"
# The one blocking HTTP client behind the guarded fetch layer (rustls, no async runtime).
ureq = "3"

# Every release build uses this profile: the phone's `cargo install` (install.sh), CI's Android
# cross-build, the Railway container (Dockerfile) and the trusted xtask builds in the issue-fix
# workflow. Thin LTO lets rustc inline across crates (serde_json, rustls) for
# 10-45% faster analysis and a quarter smaller binary, at about 1.3x the build time; fat LTO
# with one codegen unit gains a little more but more than doubles the build and the linker's
# memory on a phone. Stripping symbols saves storage the binary does not use: panic messages
# keep their text and location. panic stays "unwind": `serve` answers a panicking request with
# 500 and keeps running, which abort would turn into the whole server exiting.
# tests/manifest_policy.rs holds these settings.
[profile.release]
lto = "thin"
strip = "symbols"

# forbid cannot be reopened by a local allow, where deny can. The xtask crate sets the same.
# Every crate-level lint level lives here; tests/manifest_policy.rs refuses one in a crate root.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Priority -1 applies the group first, so the specific allows below win over it.
pedantic = { level = "warn", priority = -1 }
# Pedantic lints this crate does not enforce.
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
