[package]
name        = "huntsman-search-engine"
version     = "1.40.0"
edition     = "2024"
rust-version = "1.88"
description = "Huntsman Search Engine — comprehensive on-device OSINT/GEOINT & breach-intelligence platform for Termux aarch64 (no root)"
authors     = ["Huntsman OSINT"]
license-file = "LICENSE"        # proprietary — all rights reserved
publish      = false            # never publish to crates.io (would redistribute)
default-run = "hse"

[[bin]]
name = "hse"
path = "src/main.rs"

# Opt-in AI-daemon background poller (`src/ai/`, `src/bin/hse_ai_daemon/`). A
# separate binary — not an `hse` subcommand — so it can be started/stopped/
# supervised independently of `hse serve`/`hse scan`, and so an operator who
# never installs Ollama never runs any of this code. Deliberately UNGATED (no
# `required-features`): it needs no dependency `hse` itself doesn't already
# carry unconditionally (reqwest/serde_json/tokio), so gating it behind an
# opt-in Cargo feature would only add CI/`--features` friction for zero
# dependency-weight benefit — there is nothing extra here for a plain
# `cargo build`/the Termux cross-build to avoid compiling.
#
# Before running: arm `hse config feature.ai_daemon on` and set
# HUNTSMAN_OLLAMA_MODEL (or pass --model) to a model already pulled via
# `ollama pull <tag>` — see README's "AI-Daemon Scan Analysis" section, or
# run `hse doctor` to check both preconditions in one place.
[[bin]]
name = "hse-ai-daemon"
path = "src/bin/hse_ai_daemon/main.rs"

# Supply-chain gate: fails when a crates.io dependency in Cargo.lock was
# published more recently than a configured cooldown window (a compromised
# publish is most likely to slip through unnoticed in its first few days).
# Deliberately a separate binary rather than an `hse` subcommand — this is
# dev/CI tooling over Cargo.lock, unrelated to the OSINT scan engine's
# runtime surface. See scripts/gate.sh and .github/workflows/audit.yml for
# how it's wired in, and src/bin/dep_cooldown/main.rs for the rationale.
#
# `required-features` gates this out of a plain `cargo build`/`check` with no
# `--features dep-cooldown`: without it, this binary's `toml`/`time`
# dependencies (below, both `optional = true`) get compiled by EVERY build of
# this package regardless of which `[[bin]]` is selected — verified directly
# (`cargo clean -p toml -p time -p ...transitives... && cargo build --locked
# --lib --bin hse`, then `nm -D`/`strings` confirmed no symbols are linked
# into the `hse` binary, but the crates were compiled) — because Cargo
# resolves one package's full `[dependencies]` graph regardless of which
# `[[bin]]` target you name, it does not prune per-binary within a single
# package. That cost lands squarely on the Termux/aarch64 cross-build
# (`ci.yml`'s `aarch64-android` job, `scripts/gate.sh`'s cross-build step —
# both `--lib --bin hse` only, no `--features`), which this project is
# otherwise deliberately careful to keep lean. `check`/`clippy`/`test`/`docs`/
# MSRV still verify this binary's code — they pass `--features dep-cooldown`
# explicitly (see ci.yml, scripts/gate.sh) — only the cross-build omits it.
[[bin]]
name = "dep-cooldown"
path = "src/bin/dep_cooldown/main.rs"
required-features = ["dep-cooldown"]

# Regenerates `src/util/oui/ieee.bin` (the embedded IEEE MA-L registry blob
# read by `src/util/oui/ieee.rs`) from the upstream CSV. Dev/maintenance
# tooling, not part of the OSINT scan engine's runtime surface — a separate
# `[[bin]]` rather than an `hse` subcommand for the same reason as
# `dep-cooldown` above. Deliberately UNGATED like `hse-ai-daemon`: it needs no
# dependency `hse` doesn't already carry unconditionally (tokio/reqwest/clap/
# csv/sha2/hex), so gating it would only add CI/`--features` friction for zero
# dependency-weight benefit.
[[bin]]
name = "gen-oui"
path = "src/bin/gen_oui/main.rs"

# Resolves an `.agent/state.json` merge conflict between two concurrent
# autonomous-loop sessions (see the module doc comment for why this needs
# scripting at all). Dev-workflow tooling invoked by hand mid-conflict, not
# part of the OSINT scan engine's runtime surface — same rationale as
# `dep-cooldown`/`gen-oui` above for a separate `[[bin]]`. Deliberately
# UNGATED: needs only `serde_json`, already an unconditional dependency.
[[bin]]
name = "merge-state"
path = "src/bin/merge_state/main.rs"

# Inventories the live module capability graph (`hse serve`'s
# `/api/v1/modules` + `/api/v1/modules/graph`, or a captured
# modules.json/graph.json pair) for consolidation and correctness risks —
# see the module doc comment for what each finding means and why this reads
# the running binary rather than grepping source. Dev/architecture tooling,
# not part of the OSINT scan engine's runtime surface — same rationale as
# the other `[[bin]]`s above for a separate binary. Deliberately UNGATED:
# needs only already-unconditional dependencies (tokio/reqwest/clap/serde_json).
[[bin]]
name = "architecture-audit"
path = "src/bin/architecture_audit/main.rs"

# Packs every git-tracked file into one topologically ordered, loss-less
# monolithic text file (and unpacks/verifies it back) — see the module doc
# comment for the format and why it exists. Dev tooling for whole-repo LLM
# ingestion, not part of the OSINT scan engine's runtime surface — same
# rationale as the other `[[bin]]`s above for a separate binary.
# Deliberately UNGATED: needs only already-unconditional dependencies
# (base64/sha2/hex/clap) plus the system `git` binary at runtime.
[[bin]]
name = "pack-monolith"
path = "src/bin/pack_monolith/main.rs"

[features]
dep-cooldown = ["dep:toml", "dep:time"]

[lib]
name = "huntsman_search_engine"
path = "src/lib.rs"

# Criterion micro-benchmarks (dev-only). `harness = false` hands main() to
# criterion. CI compiles them (`cargo bench --no-run` / clippy `--all-targets`)
# so a perf-path API change can't rot the benches unnoticed; run locally with
# `cargo bench`. Scope: the hottest pure scanners on the parse path.
[[bench]]
name = "scan_throughput"
harness = false

# Scope: the correlation pass ([`core::correlator::correlate_entities`]) across
# entity-count scale, via the `#[doc(hidden)]` bench-visible entry points F.3 /
# SOL-F3 named as the last item blocking this (2026-07-14).
[[bench]]
name = "correlation_pass"
harness = false

# Lint policy, codified in the manifest (Cargo `[lints]`, stable since 1.74) so
# the standard travels with the crate and is enforced uniformly — local builds,
# rust-analyzer, and CI alike — instead of living only in the CI `clippy
# -D warnings` argv. CI still passes `-D warnings` as a belt-and-braces backstop.
[lints.rust]
# Architecture invariant (also asserted in src/lib.rs and tests/architecture.rs).
unsafe_code = "forbid"

[lints.clippy]
# Deny the default clippy groups; `priority = -1` lets the specific lints below
# (and any in-source `#[allow(...)]`) override the blanket level.
all = { level = "deny", priority = -1 }
# Curated high-signal modernizations the tree already satisfies — promoted to
# deny so they can't regress. (Stylistic/high-churn lints such as
# `manual_let_else` are deliberately NOT enforced.)
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
explicit_iter_loop = "deny"
redundant_closure_for_method_calls = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
map_unwrap_or = "deny"
unnested_or_patterns = "deny"

[dependencies]
tokio              = { version = "1",    features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "fs", "signal"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
sha1               = "0.11"
sha2               = "0.11"
md-5               = "0.11"
hex                = "0.4"
# Pinned to 0.12 (current & supported) ON PURPOSE — do not bump to 0.13 without a
# TLS-stack migration. 0.13's `rustls` feature switches trust to
# rustls-platform-verifier, which on Android reads the OS cert store over JNI via
# an app Context a Termux CLI process does NOT have → it breaks TLS on the primary
# target. The self-contained ring + webpki-roots stack here works identically on
# Termux/Linux/CI. A 0.13 move must re-create that with `rustls-no-provider` + a
# hand-built ClientConfig, and be validated on-device first.
# `gzip`: request + transparently decompress gzip responses on every reqwest
# fetch (the free + intel-API cluster). curl's paid-API transport gets the same
# via `--compressed`. Safe against decompression bombs because the fetch layer
# streams the DECOMPRESSED body and errors past `JSON_BODY_CAP` (32 MiB) — unlike
# curl's `--max-filesize`, which bounds the compressed transfer — so the reqwest
# cap already caps the expanded size. Pulls `async-compression`/`flate2`
# (flate2 already in-tree via tower-http's `compression-gzip` + `cli::cells`).
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
# Pinned to 0.39 ON PURPOSE — do NOT bump to 0.40 without a toolchain audit.
# 0.40 pulls `libsqlite3-sys` 0.38, whose build script uses the unstable
# `cfg_select!` macro (rust-lang/rust#115585). That fails to compile on the
# project's MSRV (1.88) and on current stable toolchains that have not yet
# stabilised the feature — a hard build break on the primary target. 0.39 keeps
# `libsqlite3-sys` 0.37, which builds on 1.88+. A 0.40 move must wait until
# `cfg_select!` is stable on/below our MSRV.
rusqlite           = { version = "0.39", features = ["bundled"] }
clap               = { version = "4",    features = ["derive", "env"] }
regex              = "1"
# Multi-pattern literal scanning (Teddy/SIMD). Already in the tree transitively
# via `regex`; promoted to a direct dep so `util::scan` can own the cached
# automata for untrusted-text "contains any" / leftmost-find matching (F.1).
aho-corasick       = "1"
# Single-byte SIMD search. Already in the tree transitively via `aho-corasick`
# and `regex`; promoted here so `util::html::decode_entities` can use
# `memchr` directly on the hot entity-decode path (runs on every scraped body).
memchr             = "2"
thiserror          = "2"
async-trait        = "0.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot        = "0.12"
url                = "2"
# `default-features = false` deliberately excludes `system-config` — hickory's
# own Android JNI/ConnectivityManager probe (src crate: system_conf::android,
# cfg-gated on that feature) is correctly compiled OUT of this build. Known,
# accepted upstream bloat: hickory-proto/hickory-net still declare `jni` (+ its
# jni-sys/jni-macros/jni-sys-macros transitives) as a MANDATORY, non-optional,
# non-feature-gated `[target.'cfg(target_os = "android")'.dependencies]` entry
# in their own manifests — independent of any feature flag HSE sets — purely
# for one unused ProtoError::Jni(..) error-enum variant nothing here ever
# constructs. Verified via Cargo.lock (jni v0.22.4 resolved) on this crate's
# actual Termux/Android target; no HSE-side feature flag or code change can
# avoid it short of patching/forking hickory's manifest.
hickory-resolver   = { version = "0.26", default-features = false, features = ["tokio"] }
dotenvy            = "0.15"
# v0.3 — HTTP server, SPA, SSE
axum               = { version = "0.8",  default-features = false, features = ["http1", "json", "query", "tokio", "original-uri"] }
# `compression-gzip` keeps the web UI cheap on a phone's mobile link: the
# embedded SPA (~118 KB) and vendor bundle (~528 KB) are served gzip-compressed
# (~4x smaller) on every fresh load. The gzip backend is `flate2`/`miniz_oxide`
# — pure Rust, no C/zlib dependency, so it preserves the no-native-libs Termux
# build. `CompressionLayer`'s default predicate excludes `text/event-stream`,
# so the SSE live-scan stream is never buffered/compressed.
tower-http         = { version = "0.7",  features = ["cors", "compression-gzip"] }
tokio-stream       = { version = "0.1",  features = ["sync"] }
futures            = "0.3"
# v1.2 — EXIF metadata parsing for the `exif_geo` module. Pure-Rust,
# zero transitive deps, no native libs — fits the project's
# rustls-only / no-C-deps architecture invariant.
kamadak-exif       = "0.6"
# v1.3 — base64 decode-through scanning (keyhog port). Already in
# the tree transitively via reqwest; declared directly so the
# decode-through path doesn't break if reqwest drops it.
base64             = "0.22"
# Already in the lock file transitively via tower-http compression-gzip;
# promoted here so `hse cells import` can stream-decompress CSV.GZ files.
flate2             = "1"
# Document ingestion: CSV, PDF, image parsing (Phase 1.x)
csv                = "1"
# Pure-Rust image processing for OCR preprocessing (resize, denoise).
# Image decode/analysis (document_parse). Default features are narrowed to drop
# the AVIF encoder (`ravif` → `rav1e`, hand-written asm) and OpenEXR (`exr`) from
# the DEFAULT build — i.e. the on-device build install.sh runs and the CI Release
# binary. Neither is used: AVIF *decode* is not enabled (no `dav1d` in the
# graph), the code never *encodes* AVIF, and EXR is never read, yet `rav1e`'s asm
# is one of the heaviest things the aarch64 build compiles and contradicts the
# pure-Rust goal. Every real decode/encode format an operator might ingest is
# kept explicitly, so no capability is lost. (These crates remain in Cargo.lock
# as `image`'s optional deps and are still reachable under `--all-features`, so
# the cargo-deny exceptions that mention them stay as-is; this change lightens
# the built artifact, not the lock's audit surface.)
image              = { version = "0.25", default-features = false, features = [
    "rayon", "bmp", "dds", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm",
    "qoi", "tga", "tiff", "webp",
] }
# `dep-cooldown` (src/bin/dep_cooldown/) parses Cargo.lock and dep-cooldown.toml.
# `parse` + `serde`: Deserialize straight into typed structs rather than
# hand-walking a generic `toml::Value`. `display` (needed to round-trip a
# `toml::de::Error` span through `Display`) ships in `parse`'s own dependency
# chain regardless, so nothing is saved by disabling it — declared anyway so
# the enabled-feature set here states exactly what this crate uses, not what
# happened to come along for free. `optional = true` + the `dep-cooldown`
# feature (see `[[bin]]` above) so this and `time` are NOT compiled into the
# Termux/aarch64 cross-build, which never enables that feature.
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "display"], optional = true }
# `dep-cooldown` only needs to parse crates.io's RFC 3339 `created_at` and
# compare it to `OffsetDateTime::now_utc()` — no formatting/macros/local-offset
# needed, so those stay off. `optional = true` — see `toml`'s comment above.
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tower  = { version = "0.5", features = ["util"] }
http   = "1"
proptest = "1.11.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
# `unwind` (not `abort`) so a panicking module is caught at the dispatch boundary
# (engine::run_module_guarded) and contained as a normal module error instead of
# aborting the whole process. On a long-lived `hse serve`, a hostile or drifted
# upstream that trips a module `unwrap`/slice panic would otherwise be a remote
# DoS. Costs a little binary size (unwind tables); every other size win
# (opt-level=s, LTO, codegen-units=1, strip) is retained.
panic         = "unwind"

# Fast on-device build profile — the installer's default on Termux. Drops the
# single-threaded LTO link (codegen-units=1, lto=true) that makes the `release`
# build take ~15-20 min on aarch64, cutting it to ~4-6 min, at the cost of a
# ~35% larger binary and a marginally slower hot path. HSE is network/IO-bound
# (it spends its time awaiting HTTP, not in CPU), so that runtime cost is
# negligible in practice — the right trade for an on-phone build. Use
# `HSE_FULL_BUILD=1 ./install.sh` (or `cargo build --release`) for the smallest,
# fastest artifact (e.g. the published prebuilt binary).
[profile.fast]
inherits      = "release"
opt-level     = 2
lto           = false
codegen-units = 16

[profile.dev]
opt-level = 0
debug     = 1

[profile.dev.package."*"]
opt-level = 2
