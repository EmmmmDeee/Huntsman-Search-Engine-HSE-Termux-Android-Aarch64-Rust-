[package]
name        = "huntsman-search-engine"
version     = "1.2.0"
edition     = "2024"
rust-version = "1.88"
description = "Huntsman Search Engine — prototype OSINT/GEOINT platform for Termux aarch64 (no root)"
authors     = ["Huntsman OSINT"]
license     = "MIT OR Apache-2.0"
default-run = "hse"

[[bin]]
name = "hse"
path = "src/main.rs"

[lib]
name = "huntsman_search_engine"
path = "src/lib.rs"

[dependencies]
tokio              = { version = "1",    features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "fs", "signal"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
sha1               = "0.10"
sha2               = "0.10"
md-5               = "0.10"
hex                = "0.4"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite           = { version = "0.31", features = ["bundled"] }
clap               = { version = "4",    features = ["derive", "env"] }
regex              = "1"
thiserror          = "1"
async-trait        = "0.1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot        = "0.12"
url                = "2"
hickory-resolver   = { version = "0.26", default-features = false, features = ["tokio"] }
dotenvy            = "0.15"
# v0.3 — HTTP server, SPA, SSE
axum               = { version = "0.8",  default-features = false, features = ["http1", "json", "query", "tokio", "original-uri"] }
tower-http         = { version = "0.6",  features = ["cors"] }
tokio-stream       = { version = "0.1",  features = ["sync"] }
futures            = "0.3"
# v1.2 — EXIF metadata parsing for the `exif_geo` module. Pure-Rust,
# zero transitive deps, no native libs — fits the project's
# rustls-only / no-C-deps architecture invariant.
kamadak-exif       = "0.6"
# v1.3 — base64 decode-through scanning (keyhog port). Already in
# the tree transitively via reqwest; declared directly so the
# decode-through path doesn't break if reqwest drops it.
base64             = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
tower  = { version = "0.5", features = ["util"] }
http   = "1"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
# Unwind (not abort) so a panic in one module — e.g. on a malformed external
# response — is caught and degraded to a ModuleError instead of aborting the
# whole process (fatal for a long-running `hse serve`). This activates the
# engine's existing per-module panic recovery (concurrent JoinSet + the
# sequential/Phase-1 `catch_unwind`). The cost is modest unwind tables (~0.3-0.7
# MB on the stripped binary); all other size optimisations above are retained.
# Flip back to "abort" if absolute minimum size outweighs server resilience.
panic         = "unwind"

# Fast on-device build profile — the installer's default on Termux. Drops the
# single-threaded LTO link (codegen-units=1, lto=true) that makes the `release`
# build take ~15-20 min on aarch64, cutting it to ~4-6 min, at the cost of a
# ~35% larger binary and a marginally slower hot path. HSE is network/IO-bound
# (it spends its time awaiting HTTP, not in CPU), so that runtime cost is
# negligible in practice — the right trade for an on-phone build. Use
# `HSE_FULL_BUILD=1 ./install.sh` (or `cargo build --release`) for the smallest,
# fastest artifact (e.g. the published prebuilt binary).
[profile.fast]
inherits      = "release"
opt-level     = 2
lto           = false
codegen-units = 16

[profile.dev]
opt-level = 0
debug     = 1

[profile.dev.package."*"]
opt-level = 2
