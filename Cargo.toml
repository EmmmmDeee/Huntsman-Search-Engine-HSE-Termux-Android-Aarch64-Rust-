# Reconstructed huntsman. Single package. No workspace.
# Blocking HTTP via ureq (rustls). No async runtime. Pure logic stays dependency-free.
# sha256 is in-tree so the evidence hash does not need a crate.

[package]
name = "huntsman-recon"
default-run = "huntsman-recon"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "RCVF ledger with identity, GEOINT, STIX, and Navigator gates and a guarded fetch layer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
