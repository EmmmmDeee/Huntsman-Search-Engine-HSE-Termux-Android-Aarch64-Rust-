<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HSE wasm-ui pipeline proof</title>
</head>
<body>
<!--
  Temporary diagnostic page — not linked from the real SPA (spa.html/
  router.js are untouched). Proves the full JS -> Rust/WASM pipeline before
  any real view is ported: this file, the wasm-bindgen JS glue, and the
  compiled .wasm binary are all served from the same embedded-in-the-binary
  mechanism (src/api/routes/mod.rs's APP_FILES) that already serves every
  other web-UI asset. Remove once real view ports make it redundant.
-->
<p id="wasm-proof">wasm not yet loaded — if this text never changes, the pipeline is broken</p>
<p id="confidence-proof">confidence math not yet run</p>
<p id="identities-proof">identities render not yet run</p>
<div id="identities-empty-host">(empty-case host not yet populated)</div>
<div id="identities-host">(non-empty-case host not yet populated)</div>
<p id="benchmark-proof">benchmark render not yet run</p>
<div id="benchmark-host">(benchmark host not yet populated)</div>
<script type="module">
  import init, { main, sourceCount, effC, classify, renderIdentitiesHtml, renderBenchmarkHtml } from '/static/hse_wasm_ui.js';
  await init();
  main();

  // Exercises the actual JS -> Rust deserialization boundary (not just Rust
  // calling Rust): a realistic entity object shaped exactly like the API's
  // real JSON (modeled on a real entity from a live-scan debug bundle), with
  // two genuinely-corroborating sources (source_count should be 2, not the
  // evidence array's length of 3 — "geo_normalize" is enrichment-only and
  // must not count) plus a confidence high enough to land in PROBABLE at
  // n=2's boost.
  const entity = {
    uid: "27f3f6a2628786ac78b56663e36b3a91a98d6aa5ba36e1a8fab2d8d231ae99db",
    kind: "address",
    value: "NSW 2042, Australia",
    raw_value: "NSW 2042, Australia",
    confidence: 0.32,
    corroboration: 14,
    observed_at: 1787995179,
    evidence: [
      { source: "geo_corroboration", summary: "shared-surname relative nearby", attributes: {}, recorded_at: 1787626800, verification: null, is_inferred: false },
      { source: "geo_normalize", summary: "address parse", attributes: {}, recorded_at: 1787626184, verification: null, is_inferred: false },
      { source: "qld_unclaimed", summary: "QLD unclaimed money", attributes: {}, recorded_at: 1787995080, verification: null, is_inferred: false },
    ],
    tags: ["coarse", "geoint", "family-candidate"],
    scan_id: "s",
    generation: 1,
  };
  const n = sourceCount(entity);
  const eff = effC(entity);
  const tier = classify(eff);
  document.getElementById('confidence-proof').textContent =
    `sourceCount=${n} (want 2 -- geo_normalize excluded), effC=${eff.toFixed(4)}, classify=${tier}`;

  // Exercises scan_info::identities::render_identities_html against the real
  // /scans/{id}/identities envelope shape (src/api/scan_handlers/analysis.rs
  // + src/core/coref/mod.rs's CoReference), including a value containing a
  // '<' to prove HTML-escaping actually runs on scan-derived (i.e.
  // adversary-influenceable) strings rather than trusting them verbatim.
  const emptyHtml = renderIdentitiesHtml({ min_score: 0.55, count: 0, coreferences: [] });
  document.getElementById('identities-empty-host').innerHTML = emptyHtml;

  const nonEmptyHtml = renderIdentitiesHtml({
    min_score: 0.55,
    count: 2,
    coreferences: [
      {
        uid_a: "a1", uid_b: "b1",
        value_a: "elina.moreau@example.com", value_b: "Elina Moreau",
        kind_a: "email", kind_b: "person",
        score: 0.8123,
        signals: ["shared-source", "name-token"],
      },
      {
        uid_a: "a2", uid_b: "b2",
        value_a: "<script>alert(1)<\/script>", value_b: "normal-handle",
        kind_a: "username", kind_b: "username",
        score: 0.6,
        signals: ["substring"],
      },
    ],
  });
  document.getElementById('identities-host').innerHTML = nonEmptyHtml;

  const emptyOk = emptyHtml === '';
  const escapedOk = nonEmptyHtml.includes('&lt;script&gt;') && !nonEmptyHtml.includes('<script>alert');
  const countOk = nonEmptyHtml.includes('2 selector pairs');
  const scoreOk = nonEmptyHtml.includes('score 0.81') && nonEmptyHtml.includes('score 0.60');
  document.getElementById('identities-proof').textContent =
    `emptyCase=${emptyOk}, escaped=${escapedOk}, count=${countOk}, scores=${scoreOk}`;

  // Exercises scan_info::benchmark::render_benchmark_html against the real
  // /scans/{id}/benchmark envelope shape (crate::core::benchmark::BenchmarkReport):
  // integer fields render verbatim, and the two fraction fields go through
  // Math.round(v*100)+'%' -- e.g. 0.8123 must land on 81%, not 81.23% or 0.81%.
  const benchmarkHtml = renderBenchmarkHtml({
    scan_id: "s", seed: "seed", seed_kind: "person", status: "complete",
    duration_secs: 34, entities_per_sec: 1.2345,
    modules_run: 23, modules_errored: 1, modules_timed_out: 0,
    pivot_count: 3, top_pivot_uid: null,
    scorecard: {
      multi_hop_depth: 4, graph_coverage: 0.8123, corroborated_fraction: 0.5,
      graph_density: 0.1, cut_vertex_count: 2, bridge_count: 1,
      degeneracy: 2, main_core_size: 6, total_entities: 42, total_relations: 17,
      cross_scan_bridges: 0,
    },
    metrics: {},
  });
  document.getElementById('benchmark-host').innerHTML = benchmarkHtml;
  const benchRowsOk = ['>42</td>', '>17</td>', '>23</td>', '>1.23</td>', '>4</td>']
    .every(needle => benchmarkHtml.includes(needle));
  const benchPctOk = benchmarkHtml.includes('>81%</td>') && benchmarkHtml.includes('>50%</td>');
  document.getElementById('benchmark-proof').textContent =
    `rows=${benchRowsOk}, percents=${benchPctOk}`;
</script>
</body>
</html>
