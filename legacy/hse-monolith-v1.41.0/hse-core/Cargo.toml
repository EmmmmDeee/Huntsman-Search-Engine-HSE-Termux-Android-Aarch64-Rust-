[package]
name         = "hse-core"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
description  = "HSE entity model — extracted from huntsman-search-engine's core::entity so it can be shared, unmodified, by both the native server binary and a wasm32-unknown-unknown browser build."
license-file = "../LICENSE"
publish      = false

# Deliberately NOT a `[workspace]` member of the parent crate (which has no
# `[workspace]` table at all) — same reasoning as `../fuzz/Cargo.toml`: this
# crate is built for a different target (wasm32-unknown-unknown, eventually
# via a sibling wasm-ui crate) than the gate's native `cargo
# fmt`/`clippy`/`test` commands run against, and workspace membership would
# pull it into every one of those invocations for no benefit. The parent
# crate depends on this one by ordinary path dependency, which needs no
# workspace.

[lib]
name = "hse_core"
path = "src/lib.rs"

# Mirrors the parent crate's own lint policy (../Cargo.toml) for the same
# reasons — codified here rather than only in CI argv.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
explicit_iter_loop = "deny"
redundant_closure_for_method_calls = "deny"
cloned_instead_of_copied = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
map_unwrap_or = "deny"
unnested_or_patterns = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2  = "0.11"
hex   = "0.4"

# Only pulled in for the wasm32 target — `js_sys::Date::now()` stands in for
# `std::time::SystemTime::now()`, which panics at runtime on
# wasm32-unknown-unknown (no OS clock syscall in that target).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"
proptest   = "1.11.0"
