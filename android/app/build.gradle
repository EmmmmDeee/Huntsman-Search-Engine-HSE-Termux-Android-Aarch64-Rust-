plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.huntsman.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.huntsman.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-android-candidate'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled false
            // No signing key in source control. Supply an operator-owned
            // release signing configuration before producing distributable builds.
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}