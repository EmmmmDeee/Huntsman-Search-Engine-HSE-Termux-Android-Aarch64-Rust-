[package]
name = "huntsman-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "Pure-Rust embedded graph persistence with a batched background writer for AArch64/Termux"

# Each runtime dependency states its purpose, as the workspace requires.
[dependencies]
# The entity, provenance and id types this store persists.
huntsman-core = { path = "../huntsman-core" }
# Pure-Rust embedded key-value engine (no C FFI) backing the append-only graph store.
redb = "2.1"
# Bounded channels and the oneshot durability acknowledgement for the writer handle.
tokio = { version = "1.38", default-features = false, features = ["rt", "sync"] }
# Typed domain error enum for the storage layer.
thiserror = "2.0"
# Entity (de)serialisation to and from the stored byte values.
serde_json = "1.0"
# Structured diagnostics for background-writer commit failures.
tracing = "0.1"

[dev-dependencies]
# Async test harness and a temp-file scratch backend for hermetic storage tests.
tokio = { version = "1.38", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
# `cache_metrics` makes redb count page-cache evictions, which is how the tests prove the
# configured cache budget (not redb's 1 GiB default) is in force. Test builds only.
redb = { version = "2.1", features = ["cache_metrics"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
