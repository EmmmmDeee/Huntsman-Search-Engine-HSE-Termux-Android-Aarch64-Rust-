name: Huntsman adaptive inventory
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate complete tree and machine-readable index
        run: python3 tools/huntsman_inventory.py
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: huntsman-repository-inventory
          path: |
            docs/HUNTSMAN_REPOSITORY_TREE.md
            docs/huntsman-inventory.json
          retention-days: 30
