name: Temporary reverse-image rustfmt
on:
  push:
    branches:
      - feat/native-reverse-image-search
    paths:
      - .github/workflows/format-reverse-image.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.99.0'
          components: rustfmt
      - name: Apply pinned Rustfmt and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/format-reverse-image.yml
          git add src/reverse_image.rs src/cli/reverse_image.rs src/cli/mod.rs src/lib.rs .github/workflows/format-reverse-image.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply rustfmt 1.99.0 to reverse-image integration"
            git push origin "HEAD:feat/native-reverse-image-search"
          fi
