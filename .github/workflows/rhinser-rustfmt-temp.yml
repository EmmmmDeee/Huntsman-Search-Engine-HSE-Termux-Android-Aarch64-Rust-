name: Temporary Rhinser rustfmt autofix
on:
  push:
    branches: [feature/rhinser-functional-bridge-20261030]
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.repository == 'EmmmmDeee/Huntsman-Search-Engine-HSE-Termux-Android-Aarch64-Rust-'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.99'
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit Rust formatting on feature branch only
        run: |
          git add src/rhinser_catalog.rs src/rhinser_workspace.rs src/rhinser_nfc.rs src/cli/osint.rs src/lib.rs tests/rhinser_compat.rs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(osint): apply rustfmt after query and test additions'
          git push origin HEAD:refs/heads/feature/rhinser-functional-bridge-20261030
