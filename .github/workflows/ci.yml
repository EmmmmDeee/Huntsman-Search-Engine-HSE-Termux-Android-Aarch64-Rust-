name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.87", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --locked
      - name: check leaves committed artifacts unchanged
        run: |
          cargo run --locked -- check
          git diff --exit-code -- var/

  android-aarch64:
    name: Android aarch64 cross-build
    runs-on: ubuntu-latest
    env:
      HUNTSMAN_HIBP_NO_EMBED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
          targets: aarch64-linux-android
      - uses: ./.github/actions/setup-ndk-aarch64
        with:
          android-api: "24"
      - name: Build aarch64 Android release binaries
        run: cargo build --release --locked --target aarch64-linux-android
      - name: Verify Android ELFs and stage artifacts
        run: |
          set -euo pipefail
          RECON="target/aarch64-linux-android/release/huntsman-recon"
          PROBE="target/aarch64-linux-android/release/huntsman-probe"
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist

          verify_android_elf() {
            local bin="$1"
            local name="$2"
            local header="$RUNNER_TEMP/${name}-elf-header.txt"
            local program="$RUNNER_TEMP/${name}-elf-program.txt"
            test -x "$bin"
            "$TOOLCHAIN/llvm-readelf" -h "$bin" > "$header"
            grep -Eq 'Machine:[[:space:]]+AArch64' "$header"
            "$TOOLCHAIN/llvm-readelf" -l "$bin" > "$program"
            grep -F '/system/bin/linker64' "$program"
            cp "$bin" "dist/${name}-aarch64-linux-android"
          }

          verify_android_elf "$RECON" huntsman-recon
          verify_android_elf "$PROBE" huntsman-probe

          (
            cd dist
            sha256sum huntsman-recon-aarch64-linux-android > huntsman-recon-aarch64-linux-android.sha256
            sha256sum huntsman-probe-aarch64-linux-android > huntsman-probe-aarch64-linux-android.sha256
            sha256sum -c huntsman-recon-aarch64-linux-android.sha256
            sha256sum -c huntsman-probe-aarch64-linux-android.sha256
          )
      - name: Upload main-branch handset-test artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: huntsman-recon-aarch64-linux-android
          path: |
            dist/huntsman-recon-aarch64-linux-android
            dist/huntsman-recon-aarch64-linux-android.sha256
            dist/huntsman-probe-aarch64-linux-android
            dist/huntsman-probe-aarch64-linux-android.sha256
          if-no-files-found: error
          retention-days: 14
