name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  directive-lock:
    name: Canonical Huntsman directive lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - name: Verify canonical Huntsman directive
        run: cargo test --locked --test directive_lock

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.87", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - run: cargo fmt --check
        if: matrix.toolchain == 'stable'
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: matrix.toolchain == 'stable'
      - run: cargo test --locked
      - name: check leaves committed artifacts unchanged
        run: |
          cargo run --locked -- check
          git diff --exit-code -- var/


  railway-container:
    name: Railway container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current Huntsman Recon image
        run: docker build --pull -f Dockerfile -t huntsman-recon:railway .
      - name: Exercise Railway-style runtime
        shell: bash
        run: |
          set -euo pipefail
          name=huntsman-recon-ci
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$name" \
            -p 127.0.0.1:18080:8080 \
            -e PORT=8080 \
            -e RAILWAY_ENVIRONMENT=ci \
            -e HSE_AUTH_TOKEN=ci-huntsman-token \
            -e HUNTSMAN_STARTUP_CHECK=1 \
            huntsman-recon:railway

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/huntsman-health.json; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null | grep -qx true; then
              docker logs "$name" >&2 || true
              exit 1
            fi
            sleep 1
          done

          grep -q '"status": "ok"' /tmp/huntsman-health.json
          if curl -fsS http://127.0.0.1:18080/api/modules >/dev/null 2>&1; then
            echo "protected endpoint unexpectedly accepted an unauthenticated request" >&2
            exit 1
          fi
          curl -fsS \
            -H 'Authorization: Bearer ci-huntsman-token' \
            http://127.0.0.1:18080/api/modules \
            | grep -q '"modules"'
          curl -fsS \
            -H 'Authorization: Bearer ci-huntsman-token' \
            http://127.0.0.1:18080/api/command \
            | grep -q '"invariant"'

  android-aarch64:
    name: Android aarch64 cross-build
    runs-on: ubuntu-latest
    env:
      HUNTSMAN_HIBP_NO_EMBED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
          targets: aarch64-linux-android
      - uses: ./.github/actions/setup-ndk-aarch64
        with:
          android-api: "24"
      - name: Build aarch64 Android release binary
        run: cargo build --release --locked --target aarch64-linux-android
      - name: Verify Android ELF and stage artifact
        run: |
          set -euo pipefail
          BIN="target/aarch64-linux-android/release/huntsman-recon"
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          HEADER="$RUNNER_TEMP/huntsman-elf-header.txt"
          PROGRAM="$RUNNER_TEMP/huntsman-elf-program.txt"
          test -x "$BIN"
          "$TOOLCHAIN/llvm-readelf" -h "$BIN" > "$HEADER"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$HEADER"
          "$TOOLCHAIN/llvm-readelf" -l "$BIN" > "$PROGRAM"
          grep -F '/system/bin/linker64' "$PROGRAM"
          mkdir -p dist
          cp "$BIN" dist/huntsman-recon-aarch64-linux-android
          (
            cd dist
            sha256sum huntsman-recon-aarch64-linux-android > huntsman-recon-aarch64-linux-android.sha256
            sha256sum -c huntsman-recon-aarch64-linux-android.sha256
          )
      - name: Upload main-branch handset-test artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: huntsman-recon-aarch64-linux-android
          path: |
            dist/huntsman-recon-aarch64-linux-android
            dist/huntsman-recon-aarch64-linux-android.sha256
          if-no-files-found: error
          retention-days: 14
