name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & test (Linux x86_64, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned to the SAME literal version as rust-toolchain.toml (not
      # `@stable`) so this job's clippy/rustfmt can never drift from a
      # contributor's local pinned toolchain — the exact class of surprise
      # that twice broke this branch's CI in one session before this pin
      # existed. Keep both in lockstep when bumping.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --locked

      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Docs (no broken intra-doc links, bare URLs, or stray HTML tags)
        # Guards the maintainer's primary reference against silent rot. Denies the
        # three stable, high-value rustdoc lints specifically rather than blanket
        # `-D warnings` — so a future toolchain adding a new rustdoc lint can't
        # break CI on unchanged code. `--document-private-items` because HSE's lib
        # is read internally, not as a published API (see the crate-root allow of
        # `private_intra_doc_links`).
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::bare_urls -D rustdoc::invalid_html_tags" cargo doc --no-deps --document-private-items --locked

      - name: Test
        run: cargo test --all --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    # CRITICAL: rustup resolves an ambient rust-toolchain.toml (repo root)
    # ABOVE a plain `rustup default` — which is all `dtolnay/rust-toolchain`
    # sets — so without this override the repo's new rust-toolchain.toml pin
    # (1.97.1) would silently hijack every `cargo` invocation below back onto
    # 1.97.1, defeating the MSRV gate while staying green. RUSTUP_TOOLCHAIN is
    # rustup's highest-precedence resolution source (above rust-toolchain.toml
    # AND `rustup default`), so this keeps 1.88 authoritative regardless.
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)

      - name: Check (MSRV)
        run: cargo check --all-targets --locked

  aarch64-android:
    name: Build (aarch64-linux-android, Termux target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned to the same literal version as rust-toolchain.toml — see the
      # `check` job's comment above for why `@stable` alone isn't used here.
      - name: Install Rust toolchain + aarch64 Android target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)

      # A dependency in the TLS stack (ring) compiles C in its build script,
      # so even `cargo check` for this target needs the Android NDK's
      # aarch64 clang — a bare check job is impossible here. The NDK ships
      # preinstalled on ubuntu-latest at $ANDROID_NDK_LATEST_HOME; point
      # cc-rs and cargo's linker at its aarch64 wrappers (API 24 = Termux's
      # minimum) and build the lib for real. This verifies the project's
      # actual deployment target (Termux on Android aarch64) end to end,
      # including the native crates the x86_64 jobs never cross-compile.
      - name: Setup Android NDK aarch64 cross-compile env
        uses: ./.github/actions/setup-ndk-aarch64

      - name: Build (aarch64-linux-android)
        run: cargo build --locked --lib --bin hse --target aarch64-linux-android

      # Compile-only (never executed — ubuntu-latest is x86_64, so an
      # aarch64-linux-android test binary can't run here without real device
      # emulation, which the `hse` binary + Termux itself already stand in
      # for). This still catches real regressions the x86_64 `check` job
      # can't: test code gated on `#[cfg(target_arch = "aarch64")]`, or a
      # dependency whose TEST harness (as opposed to its library code) fails
      # to cross-compile for this target. Scoped to match the build step
      # above (lib + the hse binary) plus the tests/ integration suite —
      # deliberately excludes --benches/--doc, which add cross-compile cost
      # for artifacts this job has no way to execute anyway.
      - name: Compile tests (aarch64-linux-android, not executed)
        run: cargo test --locked --no-run --lib --bin hse --tests --target aarch64-linux-android

  install-script:
    name: install.sh syntax (bash + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n install.sh
      # shellcheck ships preinstalled on ubuntu-latest — call it directly
      # rather than via a third-party action so a master-pinned drift
      # can't break this job for reasons unrelated to install.sh
      # (saw `git exit 128 / terminal prompts disabled` after a
      # ludeeus/action-shellcheck@master revision in 2026-05).
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh
