name: Huntsman phone binary acceptance
on:
  push:
    branches: [investigate-phone-0405409302-20261103]
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99"
      - name: Compile genuine Huntsman binary
        run: cargo build --locked --bin huntsman-recon
      - name: Run phone analysis and verify evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          binary=target/debug/huntsman-recon
          phone_number="+61405409302"

          "$binary" build-sha > evidence/build-sha.txt 2>&1

          phone_status=0
          "$binary" phone "$phone_number" --save evidence/phone-ledger.json > evidence/phone-output.txt 2>&1 || phone_status=$?
          printf '%s\n' "$phone_status" > evidence/phone-exit.txt

          verify_status=0
          if [ -s evidence/phone-ledger.json ]; then
            "$binary" verify evidence/phone-ledger.json > evidence/verify-output.txt 2>&1 || verify_status=$?
          else
            verify_status=1
            printf '%s\n' 'No evidence ledger generated' > evidence/verify-output.txt
          fi
          printf '%s\n' "$verify_status" > evidence/verify-exit.txt

          sources_status=0
          "$binary" sources "$phone_number" > evidence/sources.txt 2>&1 || sources_status=$?
          printf '%s\n' "$sources_status" > evidence/sources-exit.txt

          # The artifact upload step runs even when this step fails.
          for status in "$phone_status" "$verify_status" "$sources_status"; do
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: huntsman-phone-0405409302-evidence
          path: evidence/
          if-no-files-found: warn
