name: Huntsman phone binary acceptance
on:
  push:
    branches: [investigate-phone-0405409302-20261103]
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99"
      - name: Compile genuine Huntsman binary
        run: cargo build --locked --bin huntsman-recon
      - name: Run phone analysis and verify evidence
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          target/debug/huntsman-recon build-sha > evidence/build-sha.txt 2>&1
          target/debug/huntsman-recon phone "+61405409302" --save evidence/phone-ledger.json > evidence/phone-output.txt 2>&1
          echo $? > evidence/phone-exit.txt
          if [ -s evidence/phone-ledger.json ]; then
            target/debug/huntsman-recon verify evidence/phone-ledger.json > evidence/verify-output.txt 2>&1
            echo $? > evidence/verify-exit.txt
          else
            echo "No evidence ledger generated" > evidence/verify-output.txt
          fi
          target/debug/huntsman-recon sources "+61405409302" > evidence/sources.txt 2>&1
          echo $? > evidence/sources-exit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: huntsman-phone-0405409302-evidence
          path: evidence/
          if-no-files-found: warn
