name: Secret scan

# Fails any push or pull request that introduces a credential into the tree.
#
# This exists because the repository shipped live OathNet / HIBP / WiGLE /
# SeekNow credentials as "zero-config embedded defaults" — compiled into every
# published binary and committed to a public tree — plus a real SeekNow key
# pasted into docs/SEEKNOW_SETUP.md as a copy-me example. All were removed and
# must be treated as revoked. Nothing but an automated gate keeps that from
# happening again, so this runs on every push and every PR, not on a schedule.
#
# Scope: the tree AT THIS REVISION. Prior commits still contain the retired
# credentials — history cannot be un-published, which is why revocation at the
# provider (not rewriting) is the actual remedy. Gating the current tree is what
# stops NEW ones landing.
#
# Tuning lives in .gitleaks.toml. It exempts the synthetic keys that HSE's own
# credential-detection engine tests against, and exempts nothing under
# production paths.

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow reports, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool version + the checksum of the exact asset, so this gate is
  # reproducible and a compromised release cannot silently replace the scanner
  # that is supposed to catch compromises.
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -fsSL --retry 3 -o "$asset" "$url"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" gitleaks
          ./gitleaks version

      - name: Scan the tree for committed credentials
        run: |
          set -euo pipefail
          # `dir` mode scans the checked-out revision. A non-zero exit is a
          # finding; --redact keeps the secret itself out of the public log,
          # which would otherwise re-disclose whatever was just caught.
          ./gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings
        # Runs even when the scan failed — the report is most useful exactly then.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
