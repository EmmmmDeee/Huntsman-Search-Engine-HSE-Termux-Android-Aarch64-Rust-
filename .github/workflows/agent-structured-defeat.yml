name: one-shot structured defeat patch

on:
  push:
    branches:
      - design/provenance-claim-kernel-v6
    paths:
      - .github/workflows/agent-structured-defeat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/provenance-claim-kernel-v6
      - name: Apply anchored patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/intelligence.rs')
          s = p.read_text()

          old = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
pub enum ClaimState {
    Candidate,
    Supported,
    Verified,
    Rejected,
}

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
pub struct Claim {'''
          new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
pub enum ClaimState {
    Candidate,
    Supported,
    Verified,
    Rejected,
}

#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
pub enum DefeatKind {
    Rebut,
    Undermine,
    Undercut,
    Supersede,
    Compatible,
    UnknownRelation,
}

impl DefeatKind {
    #[must_use]
    pub fn blocks_verification(self) -> bool {
        matches!(self, Self::Rebut | Self::Undermine | Self::Undercut)
    }
}

#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
pub struct Defeat {
    pub evidence_id: EvidenceId,
    pub kind: DefeatKind,
    pub temporal_overlap: Option<bool>,
    pub rationale: String,
}

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
pub struct Claim {'''
          assert s.count(old) == 1, 'ClaimState anchor changed'
          s = s.replace(old, new)

          old = '''    #[serde(default)]
    pub contradictions: BTreeSet<EvidenceId>,
    #[serde(default)]
    pub provider_ids: BTreeSet<String>,'''
          new = '''    #[serde(default)]
    pub contradictions: BTreeSet<EvidenceId>,
    #[serde(default)]
    pub defeats: Vec<Defeat>,
    #[serde(default)]
    pub provider_ids: BTreeSet<String>,'''
          assert s.count(old) == 1, 'Claim fields anchor changed'
          s = s.replace(old, new)

          old = '''            support: BTreeSet::new(),
            contradictions: BTreeSet::new(),
            provider_ids: BTreeSet::new(),'''
          new = '''            support: BTreeSet::new(),
            contradictions: BTreeSet::new(),
            defeats: Vec::new(),
            provider_ids: BTreeSet::new(),'''
          assert s.count(old) == 1, 'Claim constructor anchor changed'
          s = s.replace(old, new)

          old = '''        claim.contradictions.insert(evidence_id.clone());
        self.recompute_claim_state(claim_id)
    }

    /// Records an inference trail for an existing claim.'''
          new = '''        claim.contradictions.insert(evidence_id.clone());
        self.recompute_claim_state(claim_id)
    }

    /// Attaches a structured defeater without mutating the legacy claim state.
    ///
    /// # Errors
    /// Returns [`LedgerError::MissingClaim`], [`LedgerError::MissingEvidence`],
    /// or [`LedgerError::InvalidClaim`] for an empty rationale.
    pub fn attach_defeat(&mut self, claim_id: &ClaimId, defeat: Defeat) -> Result<(), LedgerError> {
        self.ensure_evidence(&defeat.evidence_id)?;
        if defeat.rationale.trim().is_empty() {
            return Err(LedgerError::InvalidClaim);
        }
        let claim = self
            .claims
            .get_mut(claim_id)
            .ok_or_else(|| LedgerError::MissingClaim(claim_id.clone()))?;
        if !claim.defeats.contains(&defeat) {
            claim.defeats.push(defeat);
        }
        Ok(())
    }

    /// Records an inference trail for an existing claim.'''
          assert s.count(old) == 1, 'attach_contradiction anchor changed'
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/claim_policy.rs')
          s = p.read_text()
          old = '''        if !claim.contradictions.is_empty() {
            blockers.insert(VerificationBlocker::UndefeatedDefeater);
        }'''
          new = '''        if !claim.contradictions.is_empty()
            || claim
                .defeats
                .iter()
                .any(|defeat| defeat.kind.blocks_verification())
        {
            blockers.insert(VerificationBlocker::UndefeatedDefeater);
        }'''
          assert s.count(old) == 1, 'claim policy defeat anchor changed'
          s = s.replace(old, new)
          p.write_text(s)
          PY

          rm .github/workflows/agent-structured-defeat.yml
          cargo fmt --all
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/intelligence.rs src/claim_policy.rs .github/workflows/agent-structured-defeat.yml
          git commit -m 'feat(intelligence): apply structured defeat'
          git push origin HEAD:design/provenance-claim-kernel-v6
