name: Verify public live source canaries

# Real binary, keyless public-source probes. Per-source receipts remain
# visible when one source is blocked or times out.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-public-live-canaries.yml'
      - '.github/scripts/verify-public-live-canaries.sh'
      - 'src/orthogonal_osint.rs'
      - 'src/osint_synergy.rs'
      - 'src/analysis.rs'
      - 'src/web_server/lookup.rs'
      - 'src/web_ui.html'
      - 'tests/orthogonal_osint.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-live:
    name: Genuine binary against public sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUNTSMAN_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.99"
      - name: Check live-canary script syntax
        run: bash -n .github/scripts/verify-public-live-canaries.sh
      - name: Build real Huntsman release binary from this PR revision
        run: cargo build --locked --release --bin huntsman-recon
      - name: Probe live public OSINT providers with exact built binary
        id: probe
        shell: bash
        run: bash .github/scripts/verify-public-live-canaries.sh
