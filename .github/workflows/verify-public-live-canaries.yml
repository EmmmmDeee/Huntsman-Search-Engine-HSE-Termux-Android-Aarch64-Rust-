name: Verify public live source canaries

# PR-time receipt for one committed workflow change, plus explicit manual reruns.
# The historical broad live-collector-smoke.yml remains manual-only.
# This job uses no provider keys, no secrets, no writes and no deployment privileges.
on:
  pull_request:
    paths:
      - '.github/workflows/verify-public-live-canaries.yml'
      - 'src/analysis.rs'
      - 'src/orthogonal_osint.rs'
      - 'src/osint_synergy.rs'
      - 'src/stopforumspam.rs'
      - 'src/web_server/lookup.rs'
      - 'src/web_ui.html'
      - 'tests/orthogonal_osint.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-live:
    name: Genuine binary against public sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUNTSMAN_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pull_request defaults to a synthetic merge checkout; never mislabel it as PR HEAD.
      - name: Verify checked-out commit and PR parent SHAs
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout SHA differs from the GitHub workflow SHA"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            parents="$(git cat-file -p HEAD | awk '$1=="parent" {print $2}')"
            expected_parents="$(printf '%s\n%s' "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            if [ "$parents" != "$expected_parents" ]; then
              echo "::error::The tested PR merge commit does not have the expected base/head parents"
              exit 1
            fi
            echo "pr_base_sha=$PR_BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tested_checkout_sha=$checked_out" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.99"
      - name: Build binary and verify its embedded source SHA
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin huntsman-recon
          binary_sha="$(./target/release/huntsman-recon build-sha)"
          if [ "$binary_sha" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The genuine binary's embedded source SHA does not match the checkout"
            exit 1
          fi
          echo "verified_binary_sha=$binary_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Probe live public OSINT providers with exact built binary
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/huntsman-live"
          mkdir -p "$out"
          # Never forward operator credentials to the binary under test.
          unset GITHUB_TOKEN GH_TOKEN HIBP_API_KEY
          while IFS='=' read -r key _; do
            case "$key" in HUNTSMAN_*|HSE_*|*_KEY|*_TOKEN|*_SECRET) unset "$key" ;; esac
          done < <(env)
          bin="./target/release/huntsman-recon"
          printf 'probe\tmodule\texit\tverdict\tobserved\n' > "$out/verdict.tsv"
          collect() {
            local name="$1"
            shift
            timeout 150 "$bin" "$@" > "$out/$name.out" 2>&1
            echo "$?" > "$out/$name.exit"
          }
          verdict() {
            local name="$1" module="$2" code
            code="$(cat "$out/$name.exit")"
            local line status
            line="$(awk -F '\t' -v m="$module" '$1==m && ($2=="success" || $2=="valid_zero") {print;exit}' "$out/$name.out" | cut -c1-160)"
            status=FAIL
            if [ "$code" = 0 ] && [ -n "$line" ]; then status=PASS; fi
            [ -n "$line" ] || line="$(awk -F '\t' -v m="$module" '$1==m {print;exit}' "$out/$name.out" | cut -c1-160)"
            [ -n "$line" ] || line="no accepted provider row"
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$module" "$code" "$status" "$line" >> "$out/verdict.tsv"
            printf '%s: %s exit=%s %s\n' "$module" "$status" "$code" "$line"
          }
          # One username request covers two providers; do not repeat identical live probes.
          collect wikidata_q42 wikidata Q42
          verdict wikidata_q42 wikidata
          collect username_dtolnay username dtolnay
          verdict username_dtolnay github_user
          verdict username_dtolnay crates_io
          collect peeringdb_13335 asn 13335
          verdict peeringdb_13335 peeringdb
          # Reserved example-domain canary: test the real email CLI and StopForumSpam adapter.
          # An accepted result from a different provider cannot substitute for this one.
          collect stopforumspam_example email test@example.com
          verdict stopforumspam_example stopforumspam
          # Additional read-only functional breadth: actual search engines and people-source legs.
          # These are diagnostic probes, not fabricated PASSes when an upstream site blocks us.
          collect query_huntsman query huntsman spider
          collect people_douglas people Douglas Adams
          printf 'search_engines exit=%s\n' "$(cat "$out/query_huntsman.exit")"
          grep '^engine=' "$out/query_huntsman.out" | head -n 20 || true
          printf 'people_sources exit=%s\n' "$(cat "$out/people_douglas.exit")"
          grep -E '^(asic_persons|asic_director|wikidata|acnc|sec_edgar|seeknow)' "$out/people_douglas.out" | head -n 20 || true
          echo "binary_commit=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '### Public live provider receipts (actual Rust binary)' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$out/verdict.tsv" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          for f in "$out"/*.out; do
            echo "::group::$(basename "$f") (first 60 lines)"
            head -n 60 "$f" | cut -c1-240
            echo '::endgroup::'
          done
          if ! grep -q $'\tPASS\t' "$out/verdict.tsv"; then
            echo '::error::No provider returned an accepted public live outcome'
            exit 1
          fi
          if ! awk -F '\t' '$1=="stopforumspam_example" && $2=="stopforumspam" && $3=="0" && $4=="PASS" {ok=1} END {exit !ok}' "$out/verdict.tsv"; then
            echo '::error::StopForumSpam live canary failed: other provider successes do not validate the repaired adapter'
            exit 1
          fi
