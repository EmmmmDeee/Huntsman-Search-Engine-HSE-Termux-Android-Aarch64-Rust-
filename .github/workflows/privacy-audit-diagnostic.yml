name: Privacy audit diagnostic (temporary)
on:
  push:
    branches:
      - feature/privacy-exposure-audit-20261103
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99'
          components: clippy, rustfmt
      - name: Check formatting and expose compiler diagnostics
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
