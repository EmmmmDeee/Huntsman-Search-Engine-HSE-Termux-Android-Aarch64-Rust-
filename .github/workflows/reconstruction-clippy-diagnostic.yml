name: reconstruction-clippy-diagnostic

on:
  push:
    branches:
      - refactor/repository-reconstruction-2026-10-05

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Capture strict Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --locked -- -D warnings > clippy-diagnostic.txt 2>&1
          status=$?
          set -e
          printf '\nCLIPPY_EXIT_STATUS=%s\n' "$status" >> clippy-diagnostic.txt
          mkdir -p var/reconstruction
          mv clippy-diagnostic.txt var/reconstruction/clippy-diagnostic.txt
      - name: Commit diagnostic receipt
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add var/reconstruction/clippy-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(reconstruction): capture clippy diagnostic'
          git push
