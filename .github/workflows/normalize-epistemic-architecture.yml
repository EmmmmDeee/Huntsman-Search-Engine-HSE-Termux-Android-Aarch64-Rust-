name: normalize-epistemic-architecture

on:
  push:
    branches:
      - refactor/goat-proof-route-independence-20261006

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/goat-proof-route-independence-20261006
      - name: Add retrieval artifact id to L0 architecture map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          old = '| L0 primitives | `error`, `sha256`, `json`, `timefmt`, `union_find`, `tags`, `xml`, `uid`, `stage`, `event`, `fsio`, `signals`, `place`, `geohash`, `redact`, `termination`, `circuit`, `oui_ieee`, `oui`, `radar` | Pure helpers, bounded file I/O (`fsio`), retry and cache state (`circuit`) |'
          new = '| L0 primitives | `error`, `sha256`, `json`, `timefmt`, `union_find`, `tags`, `xml`, `uid`, `stage`, `event`, `fsio`, `signals`, `place`, `geohash`, `redact`, `termination`, `circuit`, `oui_ieee`, `oui`, `radar`, `retrieval_artifact` | Pure helpers, stable artifact identifiers (`retrieval_artifact`), bounded file I/O (`fsio`), retry and cache state (`circuit`) |'
          if new in text:
              print('architecture map already normalized')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('expected exactly one L0 architecture row')
          PY
      - name: Commit normalization when needed
        shell: bash
        run: |
          if git diff --quiet -- ARCHITECTURE.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md
          git commit -m 'docs(architecture): place retrieval artifact id in L0'
          git push origin HEAD:refactor/goat-proof-route-independence-20261006
