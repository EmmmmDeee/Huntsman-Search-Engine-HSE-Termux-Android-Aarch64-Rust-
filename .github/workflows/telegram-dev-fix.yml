name: telegram-dev-fix

on:
  push:
    branches: [feature/telegram-readonly-intel]
    paths:
      - .github/workflows/telegram-dev-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-readonly-intel
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: Register Telegram module in architecture map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ARCHITECTURE.md")
          s = p.read_text()
          old = "| L7 records and outputs | `ledger`, `session`, `store`, `stix`, `navigator`, `search`, `gexf`, `snake_graph`, `artifacts`, `runtime`, `people_save` | Hash-chained ledger, session store, exports, local search, bounded runtime outputs and people-lookup save |"
          new = "| L7 records and outputs | `ledger`, `session`, `store`, `stix`, `navigator`, `search`, `telegram_intel`, `gexf`, `snake_graph`, `artifacts`, `runtime`, `people_save` | Hash-chained ledger, session store, exports, local search, bounded Telegram intelligence index, bounded runtime outputs and people-lookup save |"
          if old not in s:
              raise SystemExit("expected L7 architecture row not found exactly once")
          if s.count(old) != 1:
              raise SystemExit("expected L7 architecture row is not unique")
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt
      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Huntsman Telegram Builder"
          git config user.email "158596486+EmmmmDeee@users.noreply.github.com"
          git add ARCHITECTURE.md src/telegram_intel.rs tests/telegram_intel.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: register and format Telegram intelligence"
          git push origin HEAD:feature/telegram-readonly-intel
