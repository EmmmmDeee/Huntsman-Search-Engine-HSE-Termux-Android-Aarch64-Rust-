name: cap19-repair

on:
  push:
    branches:
      - audit/exhaustive-evidence-20261005-head

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.87"
          components: rustfmt
      - name: Repair CAP19 verification surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          assurance = Path("src/assurance.rs")
          text = assurance.read_text()
          old = "coverage_layer_emits_covered_and_gap_techniques"
          new = "coverage_layer_emits_exactly_actionable_leaves"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 stale assurance test references, found {count}")
          assurance.write_text(text.replace(old, new))

          attack = Path("src/attack.rs")
          text = attack.read_text()
          for marker in [
              "const MAPPED_ENTITY_KINDS: &[EntityKind] = &[",
              "const ALL_RELATION_KINDS: &[RelationKind] = &[",
          ]:
              if text.count(marker) != 1:
                  raise SystemExit(f"expected exactly one marker: {marker}")
              text = text.replace(marker, "#[cfg(test)]\n" + marker, 1)
          attack.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Verify CAP19 red-to-green contract
        run: |
          set -euo pipefail
          cargo test --locked --test attack_recon_v19
          cargo test --locked --lib continuity_test_names_exist_in_current_sources
          cargo test --locked --lib navigator::tests
      - name: Commit verified CAP19 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/attack.rs src/navigator.rs src/assurance.rs tests/attack_recon_v19.rs
          git diff --cached --quiet && { echo "::error::CAP19 repair produced no diff"; exit 1; }
          git commit -m "fix(attack): verify v19.2 leaf coverage model"
          git push origin HEAD:audit/exhaustive-evidence-20261005-head
