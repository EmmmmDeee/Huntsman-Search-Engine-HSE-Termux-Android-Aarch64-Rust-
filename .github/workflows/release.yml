name: Release (prebuilt Termux aarch64 binary)

# Publishes a prebuilt, stripped aarch64 Termux binary so users can install
# WITHOUT a Rust toolchain or an on-device build (and so install.sh's
# auto-download fallback has an asset to fetch when the local toolchain is
# broken):
#   curl -fsSL .../releases/latest/download/hse-aarch64-linux-android -o $PREFIX/bin/hse
#   chmod +x $PREFIX/bin/hse
#
# It fires three ways:
#   • push a version tag `v*`            → publish to that tag
#   • push to main                       → publish v<Cargo.toml version> ONCE
#                                          (skipped if that tag already exists,
#                                          so it cuts a release exactly on a
#                                          version bump, not on every push)
#   • manual workflow_dispatch(tag)      → (re)build + publish to that tag
#
# The build reuses ci.yml's verified NDK recipe (the only way to cross-compile
# ring's aarch64 asm + bundled-SQLite C for Android). Target API 24 = Termux's
# minimum. The binary is rustls + bundled-SQLite only, so it has NO external
# shared-lib dependencies beyond Android's libc/libdl — it runs on a stock
# Termux with nothing else installed.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/attach the binary to (e.g. v1.4.0)"
        required: true
        default: "v1.4.0"

permissions:
  contents: write # create the tag + create/upload to the GitHub Release

# Serialise per ref so two quick pushes (or a push landing mid-build) can't race
# to create the same tag/release. Don't cancel an in-flight publish — let it
# finish; a queued follow-up no-ops once the version's tag exists.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide the target tag and whether there's anything to publish. Splitting this
  # out keeps the (slow) cross-build from even starting on a routine main push
  # whose version was already released.
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      publish: ${{ steps.t.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          set -euo pipefail
          publish=true
          case "${{ github.event_name }}" in
            workflow_dispatch)
              tag="${{ github.event.inputs.tag }}"
              ;;
            push)
              if [[ "${{ github.ref_type }}" == "tag" ]]; then
                tag="${{ github.ref_name }}"
              else
                # main push: derive v<version> from Cargo.toml and publish only
                # if that tag doesn't already exist (idempotent per version).
                ver="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
                tag="v${ver}"
                if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                  echo "Tag ${tag} already exists — nothing to publish."
                  publish=false
                fi
              fi
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${tag} publish=${publish}"

  termux-binary:
    name: Build + publish aarch64 Termux binary
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag push → check out the tag. main push / manual dispatch → check out
          # the launching commit (github.sha); the resolved tag may not exist yet
          # — the publish step creates it from this same commit. (Checking out a
          # not-yet-existent tag would fail the run.)
          ref: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && github.ref_name || github.sha }}

      - name: Install Rust + aarch64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (aarch64-linux-android)
        env:
          ANDROID_API: "24"
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang" \
            || { echo "NDK aarch64 clang not found under $TOOLCHAIN"; ls "$TOOLCHAIN" | head; exit 1; }
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --release --locked --bin hse --target aarch64-linux-android
          # The release profile already strips (Cargo.toml: strip = true), but
          # run llvm-strip too in case a future profile change drops it.
          "$TOOLCHAIN/llvm-strip" target/aarch64-linux-android/release/hse || true

      - name: Stage + checksum artifact
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/hse dist/hse-aarch64-linux-android
          ( cd dist && sha256sum hse-aarch64-linux-android > hse-aarch64-linux-android.sha256 )
          ls -l dist
          file dist/hse-aarch64-linux-android || true

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            dist/hse-aarch64-linux-android
            dist/hse-aarch64-linux-android.sha256
          body: |
            Prebuilt **aarch64 Termux** binary (no Rust toolchain needed).

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve.outputs.tag }}/hse-aarch64-linux-android -o "$PREFIX/bin/hse"
            chmod +x "$PREFIX/bin/hse"
            hse serve   # then open http://127.0.0.1:8080
            ```

            Pure rustls + bundled-SQLite — no OpenSSL, no extra `pkg` deps.
            Verify integrity with the accompanying `.sha256`.
          fail_on_unmatched_files: true
