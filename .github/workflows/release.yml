name: Release (prebuilt Termux aarch64 binary)

# Publishes a prebuilt, stripped aarch64 Termux binary on every version tag,
# so users can install WITHOUT a Rust toolchain or a 1–3 min on-device build:
#   curl -fsSL .../releases/latest/download/hse-aarch64-linux-android -o $PREFIX/bin/hse
#   chmod +x $PREFIX/bin/hse
#
# The build reuses ci.yml's verified NDK recipe (the only way to cross-compile
# ring's aarch64 asm + bundled-SQLite C for Android). Target API 24 = Termux's
# minimum. The binary is rustls + bundled-SQLite only, so it has NO external
# shared-lib dependencies beyond Android's libc/libdl — it runs on a stock
# Termux with nothing else installed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/attach the binary to (e.g. v1.4.0)"
        required: true
        default: "v1.4.0"

permissions:
  contents: write # create/upload to the GitHub Release

jobs:
  termux-binary:
    name: Build + publish aarch64 Termux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag push → check out the tag. Manual dispatch → check out the commit
          # the run was launched from (github.sha); the tag named by inputs.tag
          # may not exist yet — the publish step below creates it from this same
          # commit. (Checking out a not-yet-existent tag would fail the run.)
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref_name }}

      - name: Install Rust + aarch64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (aarch64-linux-android)
        env:
          ANDROID_API: "24"
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang" \
            || { echo "NDK aarch64 clang not found under $TOOLCHAIN"; ls "$TOOLCHAIN" | head; exit 1; }
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android${ANDROID_API}-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --release --locked --bin hse --target aarch64-linux-android
          # The release profile already strips (Cargo.toml: strip = true), but
          # run llvm-strip too in case a future profile change drops it.
          "$TOOLCHAIN/llvm-strip" target/aarch64-linux-android/release/hse || true

      - name: Stage + checksum artifact
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/hse dist/hse-aarch64-linux-android
          ( cd dist && sha256sum hse-aarch64-linux-android > hse-aarch64-linux-android.sha256 )
          ls -l dist
          file dist/hse-aarch64-linux-android || true

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/hse-aarch64-linux-android
            dist/hse-aarch64-linux-android.sha256
          body: |
            Prebuilt **aarch64 Termux** binary (no Rust toolchain needed).

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.tag || github.ref_name }}/hse-aarch64-linux-android -o "$PREFIX/bin/hse"
            chmod +x "$PREFIX/bin/hse"
            hse serve   # then open http://127.0.0.1:8080
            ```

            Pure rustls + bundled-SQLite — no OpenSSL, no extra `pkg` deps.
            Verify integrity with the accompanying `.sha256`.
          fail_on_unmatched_files: true
