name: Release (prebuilt Termux aarch64 binary)

# Main-channel pre-releases for the reconstructed `huntsman-recon` crate.
#
# Every push to main (and a manual workflow_dispatch on main) cross-builds the
# aarch64 Android/Termux `huntsman-recon` binary and publishes it as
# `main-<sha7>`, an immutable per-commit PRE-RELEASE.
#
# The rolling `latest` pre-release is NOT moved by default. huntsman-recon is an
# in-progress replacement that cannot run person lookups yet, so the legacy
# `hse` build stays the default for users. A recon build moves `latest` only
# when the repository variable PROMOTE_RECON_TO_LATEST is exactly 'true' (unset
# today). When it is, `latest` only ever moves forward along main, and is
# deleted and re-created only after checking that it is a pre-release.
#
# Every release is created with `gh release create` pre-release flags and latest=false, so none can become
# GitHub's "Latest release". This workflow never creates, edits or deletes a
# stable release: it has no tag trigger and no stable code path.
#
# Publish gate: the build must run on GitHub Actions with HSE_RELEASE=1 (which,
# with CI and HUNTSMAN_HIBP_NO_EMBED, disables build.rs HIBP key embedding),
# every build-time embed file must be empty, and the key scan of the exact
# artifacts must report zero findings. Otherwise nothing is published.
#
# Privilege split (same shape as HSE-BLE-API- release.yml):
#   * `build` runs cargo, every dependency build script and proc-macro, and the
#     checked-out key scanner with a read-only token, no GH_TOKEN and no
#     persisted git credentials. It uploads dist/ and records its digests.
#   * `publish` is the only job with contents/id-token/attestations write. It
#     never runs on pull_request, checks out nothing and runs no repository
#     code. It re-checks the downloaded bytes against the digests `build`
#     recorded, re-runs the key scan from the copy inlined below (never from
#     the artifact, which the build job could have rewritten), then attests and
#     publishes. GH_TOKEN is passed only to the steps that call the API.
#
# Ordering: per-commit releases are serialised, not coalesced. The `publish`
# job uses `queue: max`, so up to 100 pending publishes wait in FIFO order
# instead of the default single pending slot that would drop a middle commit's
# main-<sha7> (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
# Because that FIFO order is not guaranteed, each publish is idempotent (an
# existing complete main-<sha7> at this commit is verified, never replaced) and
# `latest` refuses to move to a commit that is behind the one it points at.
#
# History: this file lived at this path until f0a1c64 deleted it with the rest
# of the monolith tree. #665 then edited the copy under legacy/, which GitHub
# never runs, so main pushes after 7dca720 published nothing. The asset names
# are `huntsman-recon-*`, not the monolith's `hse-*`, so the legacy install.sh
# and in-app updater (which fetch `hse-aarch64-linux-android`) never pick up a
# different program by name.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Dry run on PRs that touch the release path: same build, embed check and
  # key scan, nothing published, no write token requested.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/scan-for-keys.sh"
      - ".github/scripts/install-termux.sh"
      - ".github/actions/setup-ndk-aarch64/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

env:
  HSE_RELEASE: "1"
  HUNTSMAN_HIBP_NO_EMBED: "1"
  ASSET: huntsman-recon-aarch64-linux-android

# Workflow level: a newer PR dry run replaces an older one. Every main run gets
# its own group (the run id), so main runs are never coalesced here; only the
# `publish` job below shares a group, with `queue: max`.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    # No token needed: an existing main-<sha7> is not a reason to skip the
    # run. `publish` decides: it verifies an existing complete pre-release at
    # this commit, or refuses a partial one, a non-prerelease or a tag at
    # another commit.
    name: Resolve main-channel tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      publish: ${{ steps.t.outputs.publish }}
    steps:
      - id: t
        env:
          GH_REF: ${{ github.ref }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA:0:7}"
          [[ "$tag" =~ ^main-[0-9a-f]{7}$ ]] || { echo "::error::bad tag ${tag}"; exit 1; }
          publish=true
          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            publish=false
            echo "Pull request: dry run (build + embed check + key scan), nothing is published." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$GH_REF" != "refs/heads/main" ]; then
            echo "::error::main-channel releases are built from refs/heads/main only (got ${GH_REF})"
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${tag} publish=${publish}"


  quality:
    name: Shared repair and Railway acceptance
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Run shared host repair acceptance
        run: bash scripts/repair-gate.sh full
      - name: Build current Railway container
        run: docker build --pull -f Dockerfile -t huntsman-recon:railway .
      - name: Exercise Railway-style runtime
        shell: bash
        run: |
          set -euo pipefail
          name=huntsman-recon-release-gate
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name "$name" \
            -p 127.0.0.1:18080:8080 \
            -e PORT=8080 \
            -e RAILWAY_ENVIRONMENT=release-gate \
            -e HSE_AUTH_TOKEN=release-gate-token \
            -e HUNTSMAN_STARTUP_CHECK=1 \
            huntsman-recon:railway
          HUNTSMAN_RAILWAY_URL=http://127.0.0.1:18080 \
          HSE_AUTH_TOKEN=release-gate-token \
            bash scripts/railway-live-acceptance.sh

  build:
    # Runs cargo and every dependency build script: read-only token, no
    # GH_TOKEN, no persisted git credentials, no OIDC.
    name: Build and key-scan aarch64 Termux binary
    needs: [resolve, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      asset_sha256: ${{ steps.digests.outputs.asset_sha256 }}
      dist_sha256: ${{ steps.digests.outputs.dist_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Refuse credentials in the build environment
        run: |
          set -euo pipefail
          # No GitHub token, OIDC request token or persisted git credential may
          # reach the steps that run repository and dependency code.
          if env | grep -E '^(GH_TOKEN|GITHUB_TOKEN|ACTIONS_ID_TOKEN_REQUEST_TOKEN|ACTIONS_ID_TOKEN_REQUEST_URL)=' >/dev/null; then
            echo "::error::a credential is set in the build job environment"; exit 1
          fi
          if git config --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "::error::checkout persisted git credentials"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05 (Merge #182)
        with:
          toolchain: "1.87"
          targets: aarch64-linux-android

      - uses: ./.github/actions/setup-ndk-aarch64
        with:
          android-api: "24"

      - name: Build aarch64 Android release binary
        run: cargo build --release --locked --target aarch64-linux-android

      - name: Require empty build-time key embed
        run: |
          set -euo pipefail
          mapfile -t embeds < <(find target/aarch64-linux-android/release/build -path '*/out/hibp_embedded_key.txt' -type f)
          [ "${#embeds[@]}" -gt 0 ] || { echo "::error::no hibp_embedded_key.txt found; cannot prove the embed is empty"; exit 1; }
          for f in "${embeds[@]}"; do
            [ ! -s "$f" ] || { echo "::error file=${f}::build-time HIBP key embed is NOT empty; refusing to publish"; exit 1; }
            echo "empty: ${f}"
          done

      - name: Verify Android ELF, strip and stage
        run: |
          set -euo pipefail
          BIN="target/aarch64-linux-android/release/huntsman-recon"
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist
          "$TOOLCHAIN/llvm-strip" -o "dist/$ASSET" "$BIN"
          # Write readelf output to files first: `readelf | grep -q` under
          # pipefail fails with LLVM's exit 74 when grep closes the pipe early.
          "$TOOLCHAIN/llvm-readelf" -h "dist/$ASSET" > "$RUNNER_TEMP/elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$RUNNER_TEMP/elf-header.txt"
          "$TOOLCHAIN/llvm-readelf" -l "dist/$ASSET" > "$RUNNER_TEMP/elf-program.txt"
          grep -F '/system/bin/linker64' "$RUNNER_TEMP/elf-program.txt"
          ndk="$(sed -n 's/^Pkg.Revision *= *//p' "$ANDROID_NDK_LATEST_HOME/source.properties" | head -n1)"
          cat > "dist/$ASSET.provenance.json" <<JSON
          {
            "artifact": "${ASSET}",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "release_tag": "${TAG}",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "cargo_lock_sha256": "$(sha256sum Cargo.lock | cut -d' ' -f1)",
            "rustc": "$(rustc --version)",
            "target": "aarch64-linux-android",
            "android_api": 24,
            "ndk": "${ndk}",
            "hse_release": "${HSE_RELEASE}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          ( cd dist && sha256sum "$ASSET" > "$ASSET.sha256" && sha256sum -c "$ASSET.sha256" )
          sed "s/@RECON_TAG@/${TAG}/g" .github/scripts/install-termux.sh > dist/install-termux.sh
          chmod 0755 dist/install-termux.sh
          grep -qF "RECON_TAG_DEFAULT=\"${TAG}\"" dist/install-termux.sh
          cat "dist/$ASSET.provenance.json"

      - name: Prove the artifact is huntsman-recon, not the legacy hse
        run: |
          set -euo pipefail
          pkg="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].name')"
          [ "$pkg" = "huntsman-recon" ] || { echo "::error::package is ${pkg}, expected huntsman-recon"; exit 1; }
          # The aarch64 Android binary cannot execute on the x86_64 runner, so
          # prove identity from the exact bytes: the hand-written CLI usage line.
          usage="$(strings -a -n 8 "dist/$ASSET" | grep -o -m1 'usage: huntsman-recon \[check.*verify LEDGER\]' || true)"
          [ -n "$usage" ] || { echo "::error::dist/${ASSET} does not contain the huntsman-recon usage line"; exit 1; }
          echo "binary_identity: ${usage}" | tee "$RUNNER_TEMP/identity.txt"

      - name: Key check on the final artifacts (must be zero)
        run: |
          set -euo pipefail
          [ "${HSE_RELEASE:-}" = "1" ] && [ "${GITHUB_ACTIONS:-}" = "true" ] \
            || { echo "::error::publishing requires a GitHub Actions build with HSE_RELEASE=1"; exit 1; }
          {
            echo "key-scan report"
            echo "artifact: ${ASSET}"
            echo "artifact_sha256: $(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
            echo "commit: ${GITHUB_SHA}"
            echo "release_tag: ${TAG}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "build_time_hibp_embed: empty (checked)"
            cat "$RUNNER_TEMP/identity.txt"
            set +e
            bash .github/scripts/scan-for-keys.sh dist 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo "result: PASS (0 findings)"; else echo "result: FAIL"; fi
          } | tee key-scan-report.txt
          grep -qx "result: PASS (0 findings)" key-scan-report.txt
          mv key-scan-report.txt dist/key-scan-report.txt

      - name: Record the digests of the scanned files
        id: digests
        run: |
          set -euo pipefail
          # `publish` re-checks the downloaded artifact against these values.
          ( cd dist && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum ) > "$RUNNER_TEMP/dist.sha256"
          cat "$RUNNER_TEMP/dist.sha256"
          {
            echo "asset_sha256=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
            echo "dist_sha256=$(sha256sum "$RUNNER_TEMP/dist.sha256" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload staged release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    # The only job with write scopes. Never on pull_request; checks out nothing
    # and runs no repository code: it verifies the handed-over bytes, re-runs
    # the inlined key scan on them, then calls the attestation action and `gh`.
    name: Publish main-channel pre-releases
    needs: [resolve, quality, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the tags and pre-releases
      id-token: write     # Sigstore-backed provenance
      attestations: write # record the attestation
    # Serialise every main publish without coalescing: `queue: max` keeps up to
    # 100 pending runs (FIFO) instead of replacing the single pending one.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
    concurrency:
      group: release-publish-main
      cancel-in-progress: false
      queue: max
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_REPO: ${{ github.repository }}
      ASSET_SHA256: ${{ needs.build.outputs.asset_sha256 }}
      DIST_SHA256: ${{ needs.build.outputs.dist_sha256 }}
    steps:
      - name: Download staged release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Re-verify the downloaded bytes against the build job's digests
        run: |
          set -euo pipefail
          [ "${HSE_RELEASE:-}" = "1" ] && [ "${GITHUB_ACTIONS:-}" = "true" ] \
            || { echo "::error::publishing requires a GitHub Actions build with HSE_RELEASE=1"; exit 1; }
          [[ "$ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no asset digest recorded by the build job"; exit 1; }
          [[ "$DIST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no dist digest recorded by the build job"; exit 1; }
          files=("$ASSET" "$ASSET.sha256" "$ASSET.provenance.json" key-scan-report.txt install-termux.sh)
          for a in "${files[@]}"; do
            [ -f "dist/$a" ] || { echo "::error::downloaded artifact is missing ${a}"; exit 1; }
          done
          n="$(find dist -mindepth 1 | wc -l)"
          [ "$n" -eq "${#files[@]}" ] || { echo "::error::downloaded artifact has ${n} entries, expected exactly ${#files[@]}"; exit 1; }
          got="$(sha256sum "dist/$ASSET" | cut -d' ' -f1)"
          [ "$got" = "$ASSET_SHA256" ] || { echo "::error::${ASSET} sha256 ${got} != ${ASSET_SHA256} recorded by the build job"; exit 1; }
          ( cd dist && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum ) > "$RUNNER_TEMP/dist.sha256"
          cat "$RUNNER_TEMP/dist.sha256"
          got="$(sha256sum "$RUNNER_TEMP/dist.sha256" | cut -d' ' -f1)"
          [ "$got" = "$DIST_SHA256" ] || { echo "::error::downloaded files differ from the ones the build job scanned"; exit 1; }
          ( cd dist && sha256sum --strict -c "$ASSET.sha256" )
          grep -qx "result: PASS (0 findings)" dist/key-scan-report.txt
          grep -qx "artifact_sha256: ${ASSET_SHA256}" dist/key-scan-report.txt \
            || { echo "::error::key-scan report does not describe this artifact"; exit 1; }
          grep -qx "commit: ${GITHUB_SHA}" dist/key-scan-report.txt \
            || { echo "::error::key-scan report does not describe this commit"; exit 1; }

      # The scanner is inlined, not taken from the artifact: the artifact comes
      # from the job that ran untrusted build code, and running a script from it
      # here would hand that code this job's write and OIDC tokens. This copy
      # comes from the workflow definition itself; tests/release_ci.rs requires
      # it to be byte-identical to .github/scripts/scan-for-keys.sh.
      - name: Re-run the key scan on the downloaded bytes (must be zero)
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/scan-for-keys.sh"
          cat > "$scanner" <<'SCAN_FOR_KEYS'
          #!/usr/bin/env bash
          # scan-for-keys.sh <path>... : exit 1 if any file under <path> holds key-like content.
          #
          # Used by .github/workflows/release.yml on the exact release artifacts before
          # anything is published: by the read-only `build` job from the checkout, and
          # by the `publish` job from a byte-identical copy inlined in the workflow (that
          # job checks out nothing; tests/release_ci.rs keeps the two copies equal).
          # It reports only the file and the rule name. It never prints a matched value.
          # Binaries are scanned through `strings -a -n 8`; text files are scanned as-is
          # and also get a high-entropy check. Every failure mode exits non-zero: a
          # missing tool, a missing path, an unreadable file, a broken rule or an
          # entropy-check error is never reported as a clean scan.
          set -uo pipefail

          # Fail closed: without these the binary scan or the entropy check would
          # silently find nothing.
          for dep in strings python3 grep find sort cat mktemp; do
            command -v "$dep" >/dev/null 2>&1 || { echo "::error::scanner dependency missing: $dep"; exit 1; }
          done
          [ "$#" -gt 0 ] || { echo "::error::usage: scan-for-keys.sh <path>..."; exit 1; }
          for p in "$@"; do
            [ -e "$p" ] || { echo "::error::scan path does not exist: $p"; exit 1; }
          done

          hits=0
          report() {
            echo "FINDING file=$1 rule=$2 (value withheld)"
            echo "::error file=$1::key-like content ($2), value withheld"
            hits=$((hits + 1))
          }

          # name<TAB>ERE. Known provider token shapes.
          RULES=(
            $'openai-style-sk\t(^|[^A-Za-z0-9_-])sk-[A-Za-z0-9_-]{20,}'
            $'anthropic\tsk-ant-[A-Za-z0-9_-]{20,}'
            $'google-api-key\tAIza[0-9A-Za-z_-]{35}'
            $'github-token\tgh[pousr]_[A-Za-z0-9]{36,}'
            $'github-pat\tgithub_pat_[A-Za-z0-9_]{60,}'
            $'slack-token\txox[abprs]-[A-Za-z0-9-]{10,}'
            $'aws-access-key-id\tAKIA[0-9A-Z]{16}'
            $'private-key-block\t-----BEGIN [A-Z ]*PRIVATE KEY-----'
            $'bearer-token\t[Bb]earer [A-Za-z0-9._~+/-]{24,}'
            # HIBP API keys are exactly 32 lowercase hex characters. The boundaries
            # (no hex character, of either case, on either side) exclude longer hex runs
            # such as 40-hex commit SHAs and 64-hex sha256 digests. A stripped release
            # binary built from main has no such run, so any hit fails the scan.
            $'hibp-key-hex\t(^|[^0-9a-fA-F])[0-9a-f]{32}([^0-9a-fA-F]|$)'
            # Credential variable names carrying a non-placeholder value.
            $'credential-assignment\t(HUNTSMAN_[A-Z0-9_]*|HIBP_[A-Z0-9_]*)(KEY|TOKEN|SECRET)["'"'"' ]*[:=]["'"'"' ]*[A-Za-z0-9_./+-]{12,}'
          )
          ALLOW_RE='insert_[a-z0-9_]+_here|AKIAIOSFODNN7EXAMPLE|<value>|\$\{?[A-Z_]+'

          ENTROPY_PY='
          import collections, math, re, sys
          txt = open(sys.argv[1], errors="ignore").read()
          for seg in set(re.findall(r"[A-Za-z0-9+]{24,}", txt)):
              if not (re.search(r"[A-Z]", seg) and re.search(r"[a-z]", seg) and re.search(r"[0-9]", seg)):
                  continue
              c = collections.Counter(seg); n = len(seg)
              if -sum(v / n * math.log2(v / n) for v in c.values()) >= 4.2:
                  print("hit")
          '

          # Build and check the sorted file list before scanning anything, so a failing
          # or truncating `find` or `sort` fails the scan (exit 2) instead of silently
          # shortening it. Never read the list through a process substitution: its exit
          # status would be lost.
          list=$(mktemp) || { echo "::error::mktemp failed"; exit 2; }
          sorted=$(mktemp) || { rm -f "$list"; echo "::error::mktemp failed"; exit 2; }
          trap 'rm -f "$list" "$sorted"' EXIT
          find "$@" -type f -print0 >"$list" || { echo "::error::find failed on: $*; refusing to scan a partial file list"; exit 2; }
          sort -z "$list" >"$sorted" || { echo "::error::sort failed; refusing to scan a partial file list"; exit 2; }
          mapfile -d '' -t found <"$list" || { echo "::error::cannot read the file list"; exit 2; }
          mapfile -d '' -t files <"$sorted" || { echo "::error::cannot read the sorted file list"; exit 2; }
          [ "${#files[@]}" -eq "${#found[@]}" ] \
            || { echo "::error::sort returned ${#files[@]} of ${#found[@]} files; refusing to scan a partial file list"; exit 2; }
          [ "${#files[@]}" -gt 0 ] || { echo "::error::nothing scanned: no files under $*"; exit 2; }

          scanned=0
          for f in "${files[@]}"; do
            scanned=$((scanned + 1))
            if grep -Iq . "$f" 2>/dev/null; then
              text=1
              data=$(cat "$f") || { echo "::error::cannot read $f"; exit 1; }
            else
              text=0
              data=$(strings -a -n 8 "$f") || { echo "::error::strings failed on $f"; exit 1; }
            fi
            for rule in "${RULES[@]}"; do
              name=${rule%%$'\t'*}
              re=${rule#*$'\t'}
              # Collect matches first: piping `grep -o` into `grep -q` can end in
              # SIGPIPE, which pipefail would turn into a silently missed finding.
              matches=$(grep -Eo -- "$re" <<<"$data")
              rc=$?
              [ "$rc" -le 1 ] || { echo "::error::rule $name failed (grep exit $rc)"; exit 1; }
              [ -n "$matches" ] || continue
              kept=$(grep -Ev -- "$ALLOW_RE" <<<"$matches")
              rc=$?
              [ "$rc" -le 1 ] || { echo "::error::allow filter failed for rule $name (grep exit $rc)"; exit 1; }
              [ -z "$kept" ] || report "$f" "$name"
            done
            if [ "$text" = 1 ]; then
              # Segments of 24+ chars mixing upper, lower and digits at >= 4.2 bits/char:
              # catches base64/alnum secrets, not paths, snake_case or hex digests.
              ent=$(python3 -c "$ENTROPY_PY" "$f") || { echo "::error::entropy check failed on $f"; exit 1; }
              while IFS= read -r line; do
                [ -n "$line" ] && report "$f" "high-entropy-string"
              done <<<"$ent"
            fi
          done

          echo "rules: ${#RULES[@]} pattern rules + high-entropy (text files)"
          echo "files scanned: $scanned"
          echo "key scan: $hits finding(s)"
          [ "$scanned" -gt 0 ] || { echo "::error::nothing scanned"; exit 1; }
          [ "$hits" -eq 0 ]
          SCAN_FOR_KEYS
          bash "$scanner" dist

      - name: Check for an existing ${{ needs.resolve.outputs.tag }}
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          files=("$ASSET" "$ASSET.sha256" "$ASSET.provenance.json" key-scan-report.txt install-termux.sh)
          exists=false
          if ref="$(gh api "$api/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            read -r type existing <<<"$ref"
            [ "$type" = "commit" ] && [ "$existing" = "$GITHUB_SHA" ] \
              || { echo "::error::tag ${TAG} already exists at ${type} ${existing}, not ${GITHUB_SHA}; refusing"; exit 1; }
            rel="$(gh api "$api/releases/tags/${TAG}")" \
              || { echo "::error::tag ${TAG} exists at this commit without a published release; delete the tag to re-publish"; exit 1; }
            [ "$(jq -r .prerelease <<<"$rel")" = "true" ] || { echo "::error::${TAG} exists and is NOT a pre-release; refusing"; exit 1; }
            for a in "${files[@]}"; do
              d="$(jq -r --arg a "$a" '[.assets[] | select(.name == $a)] | if length == 1 then (.[0].digest // "") else "" end' <<<"$rel")"
              [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] \
                || { echo "::error::${TAG} exists but asset ${a} is missing or has no digest; delete the pre-release to re-publish"; exit 1; }
            done
            exists=true
            echo "${TAG} was already published by an earlier run at this commit; verifying it, not replacing it." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        if: steps.existing.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/${{ env.ASSET }}

      - name: Warn when attestation failed
        if: steps.existing.outputs.exists == 'false' && steps.attest.outcome != 'success'
        run: echo "::warning::attestation upload failed; ${TAG} will be published without one. A re-run will not add it, because the release will then exist; to get an attested build, delete the pre-release and re-run."

      - name: Publish pre-release ${{ needs.resolve.outputs.tag }}
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=("dist/$ASSET" "dist/$ASSET.sha256" "dist/$ASSET.provenance.json" "dist/key-scan-report.txt" "dist/install-termux.sh")
          cat > notes.md <<NOTES
          **In-progress replacement. Cannot run person lookups yet.** This is a main-channel **pre-release** of \`huntsman-recon\`, the reconstructed crate, for aarch64 Android/Termux. It is not a stable release, and it is not a drop-in replacement for \`hse\`. If you need person lookups, keep using the legacy \`hse\` binary. The installer below installs \`hse\` by default.

          Built from commit \`${GITHUB_SHA}\` by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. \`${ASSET}.provenance.json\` names that commit.

          **Install on Termux.** By default this installs the legacy \`hse\` into \`\$PREFIX/bin/hse\` after checking its sha256:

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install-termux.sh | bash
          \`\`\`

          To opt in to this huntsman-recon pre-release instead (installs \`\$PREFIX/bin/huntsman-recon\` and leaves \`hse\` alone):

          \`\`\`bash
          curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install-termux.sh | HUNTSMAN_CHANNEL=recon bash
          \`\`\`

          Manual recon install:

          \`\`\`bash
          curl -fsSL -O https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}
          curl -fsSL -O https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}.sha256
          sha256sum -c ${ASSET}.sha256
          install -m 0755 ${ASSET} "\$PREFIX/bin/huntsman-recon"
          huntsman-recon help
          \`\`\`

          Authenticity (optional): \`gh attestation verify ${ASSET} --repo ${GITHUB_REPOSITORY}\`.

          Built with HSE_RELEASE=1 (no build-time key embedding). \`key-scan-report.txt\` is the zero-finding key scan of these exact files. No Termux handset run is claimed.
          NOTES
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$TAG" --notes-file notes.md

      # OFF by default: nothing moves `latest` unless the repository variable
      # PROMOTE_RECON_TO_LATEST is exactly 'true'. Until recon can run person
      # lookups, `latest` stays on the legacy hse build. When on, `latest` only
      # moves forward: a run whose commit is behind the one `latest` points at
      # (an out-of-order queue) leaves it alone.
      - name: Move the rolling `latest` pre-release to this build (opt-in)
        id: latest
        if: vars.PROMOTE_RECON_TO_LATEST == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          cur="$(gh api "$api/commits/refs/tags/latest" --jq .sha 2>/dev/null || true)"
          if [ -n "$cur" ]; then
            if [ "$cur" = "$GITHUB_SHA" ]; then status=identical; else
              status="$(gh api "$api/compare/${cur}...${GITHUB_SHA}" --jq .status)"
            fi
            case "$status" in
              ahead) echo "latest: ${cur} -> ${GITHUB_SHA} (forward)" ;;
              identical | behind)
                echo "latest already points at ${cur} (${status}); never moving it backwards." | tee -a "$GITHUB_STEP_SUMMARY"
                echo "moved=false" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              *) echo "::error::latest (${cur}) and ${GITHUB_SHA} are ${status}; refusing to move latest"; exit 1 ;;
            esac
          fi
          if pre="$(gh release view latest --json isPrerelease --jq .isPrerelease 2>/dev/null)"; then
            [ "$pre" = "true" ] || { echo "::error::release 'latest' exists and is NOT a pre-release; refusing"; exit 1; }
            gh release delete latest --yes --cleanup-tag
          fi
          # A leftover `latest` tag would make the new release reuse it instead of --target.
          if gh api "$api/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api -X DELETE "$api/git/refs/tags/latest"
          fi
          gh release create latest \
            "dist/$ASSET" "dist/$ASSET.sha256" "dist/$ASSET.provenance.json" dist/key-scan-report.txt dist/install-termux.sh \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "latest main build (${TAG})" \
            --notes "Rolling pre-release: huntsman-recon build \`${GITHUB_SHA}\` (also \`${TAG}\`), promoted via PROMOTE_RECON_TO_LATEST. Not a stable release."
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Verify published pre-releases through the API
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE: ${{ vars.PROMOTE_RECON_TO_LATEST == 'true' }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          MOVED: ${{ steps.latest.outputs.moved }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          files=("$ASSET" "$ASSET.sha256" "$ASSET.provenance.json" key-scan-report.txt install-termux.sh)
          fail() { echo "::error::$*"; exit 1; }
          # Every asset must exist exactly once with a non-empty sha256 digest.
          # mode=local: each digest must equal this run's downloaded file.
          # mode=self (an earlier run published it): the binary's digest must
          # equal the one its own .sha256 asset records.
          check_release() {
            local t="$1" mode="$2" rel sha a d want
            rel="$(gh api "$api/releases/tags/${t}")" || fail "${t}: no published release"
            [ "$(jq -r .prerelease <<<"$rel")" = "true" ] || fail "${t} is not a pre-release"
            [ "$(jq -r .draft <<<"$rel")" = "false" ] || fail "${t} is a draft"
            sha="$(gh api "$api/commits/refs/tags/${t}" --jq .sha)"
            [ "$sha" = "$GITHUB_SHA" ] || fail "${t} points at ${sha}, not ${GITHUB_SHA}"
            for a in "${files[@]}"; do
              d="$(jq -r --arg a "$a" '[.assets[] | select(.name == $a)] | if length == 1 then (.[0].digest // "") else "" end' <<<"$rel")"
              [ -n "$d" ] || fail "${t} has no digest for asset ${a}"
              [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "${t} asset ${a} digest '${d}' is not a sha256 digest"
              if [ "$mode" = local ]; then
                want="sha256:$(sha256sum "dist/$a" | cut -d' ' -f1)"
                [ "$d" = "$want" ] || fail "${t} asset ${a} digest ${d} != ${want}"
              fi
            done
            if [ "$mode" = self ]; then
              rm -rf "$RUNNER_TEMP/self" && mkdir -p "$RUNNER_TEMP/self"
              gh release download "$t" --pattern "$ASSET.sha256" --dir "$RUNNER_TEMP/self"
              want="sha256:$(sha256sum "$RUNNER_TEMP/self/$ASSET.sha256" | cut -d' ' -f1)"
              d="$(jq -r --arg a "$ASSET.sha256" '.assets[] | select(.name == $a) | .digest' <<<"$rel")"
              [ "$d" = "$want" ] || fail "${t} ${ASSET}.sha256 digest ${d} != downloaded ${want}"
              want="sha256:$(cut -d' ' -f1 "$RUNNER_TEMP/self/$ASSET.sha256")"
              d="$(jq -r --arg a "$ASSET" '.assets[] | select(.name == $a) | .digest' <<<"$rel")"
              [ "$d" = "$want" ] || fail "${t} ${ASSET} digest ${d} != ${want} from its own ${ASSET}.sha256"
            fi
            echo "${t}: prerelease=true target=${sha} assets=${#files[@]} digests verified (${mode})" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [ "$EXISTS" = "true" ]; then check_release "$TAG" self; else check_release "$TAG" local; fi
          if [ "${MOVED:-}" = "true" ]; then
            check_release latest local
          elif [ "$PROMOTE" != "true" ]; then
            # Not promoted: `latest` must not point at this build.
            lsha="$(gh api "$api/commits/refs/tags/latest" --jq .sha 2>/dev/null || echo absent)"
            [ "$lsha" != "$GITHUB_SHA" ] || fail "latest moved to this build without PROMOTE_RECON_TO_LATEST"
            echo "latest: not moved (currently ${lsha})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          latest="$(gh api "$api/releases/latest" --jq .tag_name 2>/dev/null || true)"
          case "$latest" in main-*|latest) fail "GitHub 'Latest release' is ${latest}" ;; esac
