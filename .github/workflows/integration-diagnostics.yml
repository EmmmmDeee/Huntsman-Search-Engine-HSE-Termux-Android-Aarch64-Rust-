name: integration-diagnostics

on:
  push:
    branches:
      - refactor/integration-spine-implementation-2026-10-05

permissions:
  contents: read

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture strict clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --locked -- -D warnings > clippy-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> clippy-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: integration-clippy-diagnostic-${{ github.sha }}
          path: clippy-diagnostic.txt
