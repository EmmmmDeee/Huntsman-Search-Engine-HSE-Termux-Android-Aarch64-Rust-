name: sha256-android-handset-benchmark

on:
  pull_request:
    paths:
      - 'src/sha256.rs'
      - 'examples/sha256_arm64_bench.rs'
      - '.github/workflows/sha256-android-handset-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: sha256-android-device-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-handset-benchmark:
    name: Build checksum-verified Termux ARM64 benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: '1.87'
          targets: aarch64-linux-android
      - uses: ./.github/actions/setup-ndk-aarch64
        with:
          android-api: '24'
      - name: Build exact PR head for Android
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          cargo build --release --locked --target aarch64-linux-android --example sha256_arm64_bench
      - name: Validate Android ELF, metadata and SHA-256
        run: |
          set -euo pipefail
          BIN="target/aarch64-linux-android/release/examples/sha256_arm64_bench"
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN"
          "$TOOLCHAIN/llvm-readelf" -h "$BIN" > "$RUNNER_TEMP/sha256-arm64-elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$RUNNER_TEMP/sha256-arm64-elf-header.txt"
          "$TOOLCHAIN/llvm-readelf" -l "$BIN" > "$RUNNER_TEMP/sha256-arm64-elf-program.txt"
          grep -F '/system/bin/linker64' "$RUNNER_TEMP/sha256-arm64-elf-program.txt"
          for align in $(awk '$1 == "LOAD" { print $NF }' "$RUNNER_TEMP/sha256-arm64-elf-program.txt"); do
            test "$((align))" -ge 16384
          done
          mkdir -p dist
          cp "$BIN" dist/sha256-arm64-termux-bench
          printf '%s\n' "$(git rev-parse HEAD)" > dist/source-sha.txt
          ( cd dist && sha256sum sha256-arm64-termux-bench > sha256-arm64-termux-bench.sha256 )
          ( cd dist && sha256sum -c sha256-arm64-termux-bench.sha256 )
      - name: Upload reproducible Termux benchmark binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256-arm64-termux-bench
          path: |
            dist/sha256-arm64-termux-bench
            dist/sha256-arm64-termux-bench.sha256
            dist/source-sha.txt
          if-no-files-found: error
          retention-days: 14
