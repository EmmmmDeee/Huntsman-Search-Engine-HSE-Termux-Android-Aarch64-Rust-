name: Temporary person-audit formatter diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  show-rustfmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - name: Print complete formatter delta for the changed code
        run: |
          cargo fmt --all
          git --no-pager diff -- src/person_history.rs src/cli/scans.rs
