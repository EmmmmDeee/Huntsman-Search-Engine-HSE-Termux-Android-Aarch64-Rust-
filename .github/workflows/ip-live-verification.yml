name: ip-live-verification

on:
  push:
    branches:
      - design/ip-investigation-reconstruction-20261004
    paths:
      - .github/workflows/ip-live-verification.yml

permissions:
  contents: read

jobs:
  live-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - name: Run live public-IP investigation
        run: |
          set -euo pipefail
          cargo run --locked -- ip 1.1.1.1 --json > "$RUNNER_TEMP/ip-live.json"
          cat "$RUNNER_TEMP/ip-live.json"
          jq -e '.target.address == "1.1.1.1" and .target.scope == "public"' "$RUNNER_TEMP/ip-live.json"
          jq -e '[.observations[].provider_id] | index("rdap") != null' "$RUNNER_TEMP/ip-live.json"
          jq -e '[.observations[].provider_id] | index("ripestat_network_info") != null' "$RUNNER_TEMP/ip-live.json"
          jq -e '[.observations[].provider_id] | index("cloudflare_ptr") != null' "$RUNNER_TEMP/ip-live.json"
          jq -e '.budget_used.calls >= 4 and (.termination_reason != null)' "$RUNNER_TEMP/ip-live.json"
