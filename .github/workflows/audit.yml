name: Security audit

# Required PR supply-chain check: reports RUSTSEC vulnerabilities in the locked dependency graph.
# It is a separate workflow from ci.yml. It runs on every pull request,
# dependency-changing main pushes, the weekly schedule and manual dispatch.
# The RustSec job must report a required status even for source-only PRs.
# The job reads the repository and fetches the public advisory database; it has no write scopes.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      # Installed directly, not through a third-party action, so that every step is pinned by SHA.
      # The version is the release the audit was verified with; bump it with the actions' pins.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version =0.22.2

      # Fails on any RUSTSEC vulnerability in the locked graph. Unmaintained and yanked crates are
      # printed as warnings and do not fail the run.
      - name: Audit dependencies
        run: cargo audit
