name: fortified-controller

on:
  workflow_dispatch:
  schedule:
    # Lightweight independent check; UTC, no write permissions.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: fortified-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-contract-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - name: Validate role hierarchy and phase contracts
        run: cargo run --locked -p xtask -- fortify validate
      - name: Execute deterministic verification and mutation detection
        run: cargo run --locked -p xtask -- fortify run fast
      - name: Inspect exact checkout provenance
        if: always()
        run: |
          git rev-parse HEAD
          git status --short --untracked-files=all
