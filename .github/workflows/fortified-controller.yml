name: fortified-controller

on:
  workflow_dispatch:
  schedule:
    # Lightweight independent check; UTC, no write permissions.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: fortified-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-contract-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.99"
          components: clippy, rustfmt
      - name: Validate role hierarchy and phase contracts
        run: cargo run --locked -p xtask -- fortify validate
      - name: Generate immutable implementation handoff
        id: implementation_map
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- roadmap check
          mkdir -p target/implementation-map
          cargo run --locked -p xtask -- roadmap markdown > target/implementation-map/HUNTSMAN_IMPLEMENTATION_MAP.md
          cargo run --locked -p xtask -- roadmap json > target/implementation-map/HUNTSMAN_IMPLEMENTATION_MAP.json
      - name: Execute deterministic verification and mutation detection
        run: cargo run --locked -p xtask -- fortify run fast
      - name: Upload implementation handoff for this checkout
        if: always() && steps.implementation_map.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: implementation-map
          path: target/implementation-map/
          if-no-files-found: error
          retention-days: 14
      - name: Inspect exact checkout provenance
        if: always()
        run: |
          git rev-parse HEAD
          git status --short --untracked-files=all
