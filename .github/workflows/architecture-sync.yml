name: architecture-sync

on:
  push:
    branches:
      - refactor/integration-spine-recovered-2026-10-05
    paths:
      - .github/workflows/architecture-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/integration-spine-recovered-2026-10-05
          fetch-depth: 0
      - name: Synchronize architecture module map
        shell: bash
        run: |
          set -euo pipefail
          old='`trust`, `source_registry`, `asic_persons`, `people_cli`'
          new='`trust`, `source_registry`, `pipeline`, `planner`, `asic_persons`, `people_cli`'
          grep -Fq "$old" ARCHITECTURE.md
          sed -i "s|$old|$new|" ARCHITECTURE.md
          grep -Fq "$new" ARCHITECTURE.md
      - name: Commit synchronized contract and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/architecture-sync.yml
          git add ARCHITECTURE.md
          git commit -m 'docs: map pipeline and planner into architecture'
          git push origin HEAD:refactor/integration-spine-recovered-2026-10-05
