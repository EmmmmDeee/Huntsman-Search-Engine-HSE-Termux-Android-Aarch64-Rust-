name: Fuzz

# Coverage-guided fuzzing of the untrusted-byte parsers `proptest`'s random
# generation doesn't reach as deeply as libFuzzer's mutation engine.
# Deliberately its own workflow, not a job in ci.yml, mirroring audit.yml's
# rationale: `cargo-fuzz` needs nightly (not the stable toolchain the rest of
# CI verifies against) and a full from-scratch ASAN-instrumented rebuild of
# the whole crate (a sizeable, growing codebase) is too slow to sit on every
# push/PR. Advisory-quality, like audit.yml —
# NOT a required check, so a fuzz-run hiccup never blocks an unrelated PR; it
# surfaces on the schedule, on a change to the fuzz harness itself, and on
# manual dispatch.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC (audit.yml already owns 06:00)
  workflow_dispatch:
  push:
    paths:
      - 'fuzz/**'
      - 'src/modules/cert_intel/**'
      - 'src/util/entity_extractor/**'
      - 'src/util/str_util/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: cargo fuzz (cert_der + ingest_text, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz"

      # Installed directly rather than via a third-party action — same
      # action-pinning-drift rationale as ci.yml/audit.yml's direct
      # `cargo install` calls.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Seeds a scratch corpus dir from the project's existing real-certificate
      # fixture (`src/modules/cert_intel/testdata/`) — single-sourced test
      # data, never duplicated in the repo.
      # IMPORTANT: libFuzzer treats every directory given on its command line
      # as read *and write* — it saves newly-discovered interesting inputs
      # back into it. Pointing it at the real fixture directory would litter
      # `src/modules/cert_intel/testdata/` with generated files on every run,
      # so the seed is copied into a throwaway `fuzz/corpus/cert_der/`
      # (gitignored, recreated fresh each run) instead of fuzzing the source
      # tree in place. Bounded to 120s wall-clock: enough to both replay the
      # seed as a deterministic regression check AND spend real mutation
      # budget on this schedule, without an open-ended run that could hang a
      # scheduled job.
      - name: Fuzz cert_der (120s, seeded from the real DER fixture)
        run: |
          mkdir -p fuzz/corpus/cert_der
          cp src/modules/cert_intel/testdata/selfsigned.der fuzz/corpus/cert_der/seed_selfsigned.der
          cd fuzz
          # `+nightly` is REQUIRED: the repo-root rust-toolchain.toml pins stable
          # 1.97.1, and rustup resolves that file ABOVE the `rustup default
          # nightly` the install step sets — so a bare `cargo fuzz run` builds on
          # 1.97.1 and dies with "error: the option `Z` is only accepted on the
          # nightly compiler" (cargo-fuzz's ASAN build passes `-Zsanitizer`). The
          # explicit `+nightly` is rustup's highest-precedence selector (above
          # rust-toolchain.toml) and propagates via RUSTUP_TOOLCHAIN to the inner
          # `cargo build` cargo-fuzz spawns — the same override the documented
          # local command in fuzz/README.md already uses.
          cargo +nightly fuzz run cert_der corpus/cert_der -- -max_total_time=120 -seed=1

      # The ingest text pipeline: a whole document an operator pointed the tool
      # at (crawled page, breach dump, OCR output, imported file), not bytes off
      # a socket. Byte-index-sensitive — confidence boosting slices a context
      # window around each match, and `util::str_util::char_window` is what keeps
      # that off a char boundary; this is what proves it.
      #
      # The seed is written inline rather than copied from the source tree
      # because it is a CORPUS SEED, not a fixture: its job is to hand libFuzzer
      # one input already covering every extracted kind so mutation starts from
      # coverage instead of finding the shapes from scratch. Nothing in `src/`
      # asserts against it, so single-sourcing does not apply. The multi-byte
      # line is deliberate — it puts a non-ASCII boundary next to a match on the
      # very first input.
      - name: Fuzz ingest_text (120s, seeded across every extracted kind)
        run: |
          mkdir -p fuzz/corpus/ingest_text
          cat > fuzz/corpus/ingest_text/seed_all_kinds <<'SEED'
          contact a.user+tag@example.com or visit https://sub.example.co.uk/path?q=1
          hosts 192.0.2.44 and 2001:db8::8a2e:370:7334 and fe80::1%eth0 [::ffff:192.0.2.1]
          md5 5d41402abc4b2a76b9719d911017c592
          sha1 aaf4c61ddcc5e8a2dabede0f3b482cd9aea9434d
          sha256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          follow @some_handle and @a
          not-an-address std::vector<int> 12:34:56 de:ad:be:ef:00:01
          multibyte: café → naïve ☃ 日本語 a@b.com 𝔘𝔫𝔦𝔠𝔬𝔡𝔢
          SEED
          cd fuzz
          # `+nightly` for the same rust-toolchain.toml precedence reason as above.
          cargo +nightly fuzz run ingest_text corpus/ingest_text -- -max_total_time=120 -seed=1
