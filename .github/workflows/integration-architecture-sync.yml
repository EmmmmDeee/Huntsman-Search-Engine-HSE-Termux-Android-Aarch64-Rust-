name: integration-architecture-sync

on:
  push:
    branches:
      - refactor/integration-spine-implementation-2026-10-05

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/integration-spine-implementation-2026-10-05
          fetch-depth: 0
      - name: Synchronize architecture map and architecture test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_idempotent(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_idempotent(
              "tests/architecture_doc.rs",
              '        tree.main_deps = tree.resolve(&roots, "main");\n        tree\n',
              '        tree.main_deps = tree.resolve(&roots, "main");\n        let investigate_path = src.join("bin/investigate.rs");\n        let mut investigate_roots = Vec::new();\n        tree.walk(&investigate_path, 0, "huntsman_recon", &mut investigate_roots);\n        tree.main_deps\n            .extend(tree.resolve(&investigate_roots, "investigate"));\n        tree\n',
          )
          replace_idempotent(
              "tests/architecture_doc.rs",
              '        ["main"],\n        "the Binary row must be exactly `main`"\n',
              '        ["main", "investigate"],\n        "the Binary row must name every executable entry point"\n',
          )

          arch = Path("ARCHITECTURE.md")
          text = arch.read_text()
          old_cycle = '- Dependency cycles: `address_au`–`canonical`–`domains`–`textnorm`–`validation` (L3); `attack`–`attack_catalog` (L5).'
          new_cycle = '- Dependency cycles: `address_au`–`canonical`–`domains`–`textnorm`–`validation` (L3); `attack`–`attack_catalog` (L5); `collection`–`pipeline` (L5).'
          if new_cycle not in text:
              if old_cycle not in text:
                  raise SystemExit("architecture dependency-cycle line drifted")
              text = text.replace(old_cycle, new_cycle, 1)

          old_l5 = '| L5 entity model and analysis | `entity`, `identity`, `relation`, `graph`, `coref`, `correlator`, `cross_scan`, `dependency`, `module`, `attack`, `attack_catalog`, `exposure`, `profiles`, `leads`, `timeline`, `community`, `diff`, `path`, `pivot`, `intelligence`, `classifier`, `classify_module`, `lineage`, `assurance`, `benchmark`, `coverage`, `diamond`, `gap`, `metrics`, `roi`, `trust`, `source_registry`, `asic_persons`, `people_cli` |'
          new_l5 = '| L5 entity model and analysis | `entity`, `identity`, `relation`, `graph`, `coref`, `correlator`, `correlation_bridge`, `cross_scan`, `dependency`, `module`, `attack`, `attack_catalog`, `exposure`, `profiles`, `leads`, `timeline`, `community`, `diff`, `path`, `pivot`, `intelligence`, `analysis`, `classifier`, `classify_module`, `lineage`, `assurance`, `benchmark`, `coverage`, `collection`, `pipeline`, `planner`, `archive_bridge`, `diamond`, `gap`, `metrics`, `roi`, `trust`, `source_registry`, `asic_persons`, `people_cli` |'
          if new_l5 not in text:
              if old_l5 not in text:
                  raise SystemExit("architecture L5 row drifted")
              text = text.replace(old_l5, new_l5, 1)

          old_l7 = '| L7 records and outputs | `ledger`, `session`, `store`, `stix`, `navigator`, `search`, `gexf`, `snake_graph` |'
          new_l7 = '| L7 records and outputs | `ledger`, `session`, `store`, `stix`, `navigator`, `search`, `gexf`, `snake_graph`, `artifacts`, `runtime` |'
          if new_l7 not in text:
              if old_l7 not in text:
                  raise SystemExit("architecture L7 row drifted")
              text = text.replace(old_l7, new_l7, 1)

          old_binary = '| Binary | `main` | Dispatch for the 12 commands; calls L0, L1, L2, L3, L5, L6 and L7 directly, never L4 |'
          new_binary = '| Binary | `main`, `investigate` | Executable entry points; collectively call L0, L1, L2, L3, L5, L6 and L7 directly, never L4 |'
          if new_binary not in text:
              if old_binary not in text:
                  raise SystemExit("architecture Binary row drifted")
              text = text.replace(old_binary, new_binary, 1)

          old_planned = 'PLANNED: a collector layer between L4 and L5 that turns a selector into source requests and a source response into `entity::Evidence` plus an `evidence_ancestry` node. It is the missing causal boundary named in the audit. The binary reaches L4 only through it.'
          new_current = 'CURRENT integration spine: `planner` composes dependency/module economics and lead-only routes; `collection` is the provider-neutral execution envelope; `pipeline` normalizes observations into provenance-bearing entities, ancestry and relations; `analysis` fans one immutable snapshot into intelligence/metrics/gaps/pivots/coreference/correlation/cross-scan; `artifacts` renders bounded outputs; `runtime` composes the offline end-to-end path. Source-specific execution remains behind guarded fetch/source clients; the offline `investigate` binary plans external work but does not claim it was executed.'
          if new_current not in text:
              if old_planned not in text:
                  raise SystemExit("architecture collector-state paragraph drifted")
              text = text.replace(old_planned, new_current, 1)

          arch.write_text(text)
          PY
      - name: Commit synchronized architecture
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md tests/architecture_doc.rs
          git commit -m "docs: synchronize integration architecture [arch-sync]"
          git push origin HEAD:refactor/integration-spine-implementation-2026-10-05
