name: reconstruction-consistency-repair

on:
  push:
    branches:
      - refactor/repository-reconstruction-2026-10-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile architecture and archive documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "> Legacy archives and extracted files are preserved as read-only references,\n> not installable/current source. See [architecture and status](ARCHITECTURE.md).",
              "> Canonical extracted legacy trees are preserved as read-only reconstruction references;\n> the original archive bytes remain recoverable from Git history. See\n> [archive provenance](docs/ARCHIVE_PROVENANCE.md) and [architecture and status](ARCHITECTURE.md).",
          )
          replace_once(
              "README.md",
              "| `legacy/` | Byte-identical extraction of both archives. Not part of the build. |\n| `*.zip` (root) | The two legacy archives. Pinned by hash in `tests/legacy_reference.rs`; never delete, edit or move them. |",
              "| `legacy/` | Canonical extracted historical reference trees. Not part of the build. |\n| `docs/ARCHIVE_PROVENANCE.md` | SHA-256/Git identities and recovery commit for the removed root ZIP snapshots. |",
          )
          replace_once(
              "README.md",
              "The refactor-overlay foundations from the uploaded zip are library modules:",
              "The refactor-overlay foundations preserved under `legacy/refactor-overlay-feef60a/` are library modules:",
          )

          replace_once(
              "ARCHITECTURE.md",
              "**CURRENT** means it is true of `main` at `19de6792` and can be checked in `src/`, `tests/` or CI.",
              "**CURRENT** means it is true of the repository tree containing this document and can be checked in `src/`, `tests/` or CI.",
          )
          replace_once(
              "ARCHITECTURE.md",
              "| L3 normalisation | `textnorm`, `canonical`, `validation`, `domains`, `address_au`, `postcode_au`, `au_id`, `breach`, `spf`, `dmarc`, `tlsrpt` | Canonical forms, validators, record parsers; `postcode_au` also has one postcode lookup over an injected `http::Transport` (its only crate dependency is `http`), and `au_id` re-exports it (`src/au_id.rs:13`) |",
              "| L3 normalisation | `textnorm`, `canonical`, `validation`, `domains`, `address_au`, `postcode_au`, `au_id`, `breach`, `archive`, `spf`, `dmarc`, `tlsrpt` | Canonical forms, validators and record parsers; `archive` models archive-URL identity and deterministic capture aggregation over `canonical`; `postcode_au` also has one postcode lookup over an injected `http::Transport` (its only crate dependency is `http`), and `au_id` re-exports it (`src/au_id.rs:13`) |",
          )
          replace_once(
              "ARCHITECTURE.md",
              "- The two root zip archives are pinned by SHA-256 (`tests/legacy_reference.rs`). `legacy/` is never modified.",
              "- Canonical extracted legacy trees are file-count pinned by `tests/legacy_reference.rs`; original root-ZIP SHA-256/Git identities and a recoverable commit are recorded in `docs/ARCHIVE_PROVENANCE.md`, and `tests/repository_hygiene.rs` forbids opaque root snapshots from returning.",
          )

          replace_once(
              "docs/DISPOSITIONS.md",
              "Evidence source: `legacy/` and the two root zip archives. Never delete, edit or move them.",
              "Evidence source: the canonical extracted trees under `legacy/`. Original archive SHA-256/Git identities and a recoverable commit are recorded in `ARCHIVE_PROVENANCE.md`. Do not mutate legacy oracle content without updating provenance and differential evidence.",
          )

          replace_once(
              "docs/RECONSTRUCTION_2026-10-02.md",
              "Passes are recorded in order; a later pass supersedes an earlier one. In particular, the seventh pass reversed the second: the legacy zip archives are back in the repository root and extracted into `legacy/`, and network access is allowed through the guarded `egress`/`http`/`fetch`/`keys` layer.",
              "Passes are recorded in order; a later pass supersedes an earlier one. The 2026-10-05 repository reconstruction continuation supersedes the seventh-pass ZIP-retention decision: canonical extracted trees remain under `legacy/`, opaque ZIP containers are absent from HEAD but their exact bytes remain recoverable from Git history, and network access remains allowed through the guarded `egress`/`http`/`fetch`/`keys` layer. See `ARCHIVE_PROVENANCE.md`.",
          )

          reconstruction = Path("docs/RECONSTRUCTION_2026-10-02.md")
          text = reconstruction.read_text()
          marker = "## Repository reconstruction continuation — 2026-10-05"
          if marker not in text:
              text = text.rstrip() + """

## Repository reconstruction continuation — 2026-10-05

This continuation changes repository representation, not the historical evidence oracle. The two root ZIP containers were removed from HEAD after their extracted trees had become the canonical reviewable references under `legacy/`. Exact archive SHA-256 values, Git blob identities, extracted-tree identities and the pre-removal baseline commit `01089c7e756216a33573cdefdfd7068dfa4e5380` are recorded in `ARCHIVE_PROVENANCE.md`, so byte-for-byte rollback remains possible from Git history.

`tests/legacy_reference.rs` now pins the extracted oracle tree file counts (1314 monolith files and 40 overlay files). `tests/repository_hygiene.rs` rejects opaque root-level project snapshots. This does not claim that archive-member equivalence was independently recomputed during this continuation; it preserves the already-extracted trees as canonical HEAD content while retaining the original containers in Git history.

The archive observation model added during the reconstruction is compiled as L3 normalisation because it is pure model/parser/aggregation logic and depends only on `canonical`. `tests/architecture_doc.rs` enforces that placement and its dependency direction.
"""
              reconstruction.write_text(text)

          hygiene = Path("tests/repository_hygiene.rs")
          text = hygiene.read_text()
          marker = "fn archive_documentation_tracks_the_canonical_extracted_state()"
          if marker not in text:
              text = text.rstrip() + r'''

#[test]
fn archive_documentation_tracks_the_canonical_extracted_state() {
    let root = PathBuf::from(env!("CARGO_MANIFEST_DIR"));
    let readme = fs::read_to_string(root.join("README.md")).expect("README.md");
    let architecture =
        fs::read_to_string(root.join("ARCHITECTURE.md")).expect("ARCHITECTURE.md");
    let dispositions = fs::read_to_string(root.join("docs/DISPOSITIONS.md"))
        .expect("docs/DISPOSITIONS.md");
    let reconstruction = fs::read_to_string(root.join("docs/RECONSTRUCTION_2026-10-02.md"))
        .expect("docs/RECONSTRUCTION_2026-10-02.md");

    assert!(readme.contains("docs/ARCHIVE_PROVENANCE.md"));
    assert!(architecture.contains("docs/ARCHIVE_PROVENANCE.md"));
    assert!(dispositions.contains("ARCHIVE_PROVENANCE.md"));
    assert!(reconstruction.contains("ARCHIVE_PROVENANCE.md"));

    assert!(!readme.contains("`*.zip` (root)"));
    assert!(!architecture.contains("two root zip archives are pinned"));
    assert!(!dispositions.contains("two root zip archives"));
    assert!(!reconstruction.contains("legacy zip archives are back in the repository root"));
}
'''
              hygiene.write_text(text)
          PY
      - name: Commit consistency repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ARCHITECTURE.md docs/DISPOSITIONS.md docs/RECONSTRUCTION_2026-10-02.md tests/repository_hygiene.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(repository): align architecture and archive provenance'
          git push
