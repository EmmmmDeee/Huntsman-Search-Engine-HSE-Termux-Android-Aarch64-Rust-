name: reconstruction-test-diagnostic

on:
  push:
    branches:
      - refactor/repository-reconstruction-2026-10-05

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - name: Capture Rust 1.87 test diagnostics
        shell: bash
        run: |
          set +e
          cargo test --locked > test-diagnostic.txt 2>&1
          status=$?
          set -e
          printf '\nTEST_EXIT_STATUS=%s\n' "$status" >> test-diagnostic.txt
          mkdir -p var/reconstruction
          mv test-diagnostic.txt var/reconstruction/test-diagnostic.txt
      - name: Commit diagnostic receipt
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add var/reconstruction/test-diagnostic.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(reconstruction): capture rust-1.87 test diagnostic'
          git push
