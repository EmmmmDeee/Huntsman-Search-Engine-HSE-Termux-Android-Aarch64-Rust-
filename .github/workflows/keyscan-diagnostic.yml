name: Keyscan diagnostic

on:
  push:
    branches:
      - audit/exhaustive-current-20261005

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner with redacted report
        id: scan
        shell: bash
        run: |
          set +e
          bash .github/scripts/scan-for-keys.sh \
            .github .gitignore ARCHITECTURE.md CHANGELOG.md Cargo.lock Cargo.toml README.md \
            build.rs deploy docs install.sh legacy src tests var > keyscan-report.txt 2>&1
          rc=$?
          echo "scan_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyscan-redacted-report
          path: keyscan-report.txt
          if-no-files-found: error
      - name: Preserve scanner verdict
        if: always()
        shell: bash
        run: exit "${{ steps.scan.outputs.scan_rc }}"
