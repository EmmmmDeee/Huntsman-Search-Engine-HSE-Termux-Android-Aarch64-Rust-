name: Format native public OSINT once
on:
  push:
    branches: [feat/native-public-osint-fbi-gdelt]
    paths: [.github/workflows/format-native-osint-once.yml]
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.99"
          components: rustfmt
      - name: Format only existing Rust source and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git add -- src/public_osint.rs src/cli/public_osint.rs src/cli/mod.rs src/cli/service.rs src/cli/help.rs src/lib.rs
          if git diff --cached --quiet; then
            echo "No formatter changes."
            exit 0
          fi
          git -c user.name='Huntsman CI' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "style(osint): rustfmt native public collectors"
          git push origin HEAD:feat/native-public-osint-fbi-gdelt
