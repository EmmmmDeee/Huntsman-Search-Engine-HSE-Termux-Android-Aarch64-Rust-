name: Exhaustive repository audit

on:
  push:
    branches:
      - audit/exhaustive-evidence-20261005-head

permissions:
  contents: write

env:
  HSE_RELEASE: "1"
  HUNTSMAN_HIBP_NO_EMBED: "1"

jobs:
  inventory-and-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Account for every tracked file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files > audit-files.txt
          n=$(wc -l < audit-files.txt | tr -d ' ')
          legacy=$(grep -c '^legacy/' audit-files.txt || true)
          active=$(grep -c '^src/' audit-files.txt || true)
          tests=$(grep -c '^tests/' audit-files.txt || true)
          docs=$(grep -c '^docs/' audit-files.txt || true)
          printf 'TRACKED_N=%s\nLEGACY=%s\nSRC=%s\nTESTS=%s\nDOCS=%s\n' "$n" "$legacy" "$active" "$tests" "$docs"
          test "$(find legacy/hse-monolith-v1.41.0 -type f | wc -l | tr -d ' ')" -eq 1314
          test "$(find legacy/refactor-overlay-feef60a -type f | wc -l | tr -d ' ')" -eq 40

      - name: Apply minimal Private Person repair in worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/validation.rs')
          text = path.read_text()
          if 'fn is_private_person_placeholder' not in text:
              anchor = '''#[must_use]\npub fn is_placeholder_domain(host: &str) -> bool {'''
              helper = '''#[inline]\nfn is_private_person_placeholder(value: &str) -> bool {\n    normalized_ascii_alnum_eq(value, "privateperson")\n}\n\n#[must_use]\npub fn is_placeholder_domain(host: &str) -> bool {'''
              if anchor not in text:
                  raise SystemExit('placeholder-domain anchor not found')
              text = text.replace(anchor, helper, 1)

              whois = '''pub fn is_whois_privacy_placeholder(s: &str) -> bool {\n    const MARKERS: &[&str] = &[\n'''
              whois_fixed = '''pub fn is_whois_privacy_placeholder(s: &str) -> bool {\n    if is_private_person_placeholder(s) {\n        return true;\n    }\n    const MARKERS: &[&str] = &[\n'''
              if whois not in text:
                  raise SystemExit('WHOIS placeholder anchor not found')
              text = text.replace(whois, whois_fixed, 1)

              person = '''fn is_placeholder_person(name: &str) -> bool {\n    matches!(\n'''
              person_fixed = '''fn is_placeholder_person(name: &str) -> bool {\n    is_private_person_placeholder(name)\n        || matches!(\n'''
              if person not in text:
                  raise SystemExit('person placeholder anchor not found')
              text = text.replace(person, person_fixed, 1)
              path.write_text(text)
          PY

          cargo fmt -- src/validation.rs
          changed=$(git diff --name-only)
          printf 'worktree changes:\n%s\n' "$changed"
          test "$changed" = 'src/validation.rs'

      - name: Verify repair on host test surface
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --release --locked
          cargo test --locked
          cargo run --locked -- check
          git diff --exit-code -- var

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.87"
          targets: aarch64-linux-android

      - uses: ./.github/actions/setup-ndk-aarch64
        with:
          android-api: "24"

      - name: Cross-build and scan the actual Termux artifact class
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-linux-android
          mapfile -t embeds < <(find target/aarch64-linux-android/release/build -path '*/out/hibp_embedded_key.txt' -type f)
          [ "${#embeds[@]}" -gt 0 ] || { echo '::error::no HIBP embed proof file'; exit 1; }
          for f in "${embeds[@]}"; do
            [ ! -s "$f" ] || { echo "::error file=${f}::build-time HIBP embed is not empty"; exit 1; }
          done
          bin=target/aarch64-linux-android/release/huntsman-recon
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p audit-dist
          "$toolchain/llvm-strip" -o audit-dist/huntsman-recon-aarch64-linux-android "$bin"
          "$toolchain/llvm-readelf" -h audit-dist/huntsman-recon-aarch64-linux-android > "$RUNNER_TEMP/header.txt"
          grep -Eq 'Machine:[[:space:]]+AArch64' "$RUNNER_TEMP/header.txt"
          "$toolchain/llvm-readelf" -l audit-dist/huntsman-recon-aarch64-linux-android > "$RUNNER_TEMP/program.txt"
          grep -F '/system/bin/linker64' "$RUNNER_TEMP/program.txt"
          bash .github/scripts/scan-for-keys.sh audit-dist

      - name: Commit only after host and target verification succeed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/validation.rs; then
            echo 'repair already committed; nothing to do'
            exit 0
          fi
          git config user.name 'Huntsman Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/validation.rs
          git commit -m 'fix(validation): reject Private Person placeholder'
          git push origin HEAD:audit/exhaustive-evidence-20261005-head

      - name: Upload accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-audit-accounting
          path: audit-files.txt
          if-no-files-found: error
