name: Exhaustive repository audit

on:
  push:
    branches:
      - audit/exhaustive-current-20261005

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact tracked-file disposition manifest
        shell: bash
        run: |
          set -euo pipefail
          git ls-files > audit-files.txt
          n=$(wc -l < audit-files.txt | tr -d ' ')
          printf 'path\tclass\tmateriality\tdisposition\trationale\n' > audit-manifest.tsv

          while IFS= read -r path; do
            class=''
            materiality=''
            disposition='KEEP'
            rationale=''
            case "$path" in
              .github/workflows/exhaustive-audit.yml)
                class='audit-instrumentation'; materiality='temporary'; disposition='REMOVE'; rationale='temporary exhaustive-audit instrumentation; excluded from authoritative baseline N and removed before final branch' ;;
              legacy/README.md)
                class='legacy-provenance'; materiality='supporting'; rationale='documents canonical legacy oracle trees and must remain aligned with provenance invariants' ;;
              legacy/*)
                class='legacy-oracle'; materiality='oracle'; rationale='immutable historical differential/provenance oracle; semantic behavior is assessed through reconstruction dispositions and differential tests rather than treated as active runtime code' ;;
              deploy/*)
                class='deployment-config'; materiality='critical-runtime'; rationale='production deployment/build/runtime control path; requires semantic build, startup, persistence, recovery, auth and health verification' ;;
              src/*.rs|src/*/*.rs)
                class='active-rust'; materiality='runtime'; rationale='compiled current-crate source; requires semantic/runtime/test/dependency review proportional to reachability and side effects' ;;
              src/*.bin)
                class='embedded-data'; materiality='runtime-data'; rationale='compiled/runtime lookup data; validate owner, reproducibility, integrity and consumers' ;;
              tests/fixtures/*)
                class='test-fixture'; materiality='test-data'; rationale='pinned regression/differential fixture; retain only while referenced and provenance-valid' ;;
              tests/*.rs)
                class='integration-test'; materiality='verification'; rationale='executable acceptance/regression contract for current behavior' ;;
              .github/workflows/*)
                class='ci-workflow'; materiality='verification-infrastructure'; rationale='CI/release control path; verify permissions, triggers and exact gates' ;;
              .github/actions/*|.github/scripts/*|.github/actionlint.yaml)
                class='ci-tooling'; materiality='verification-infrastructure'; rationale='build/security/target tooling used by CI' ;;
              docs/superpowers/*)
                class='design-record'; materiality='documentation'; rationale='historical/current design and implementation record; keep when it preserves decision provenance and does not conflict with authoritative behavior' ;;
              docs/*)
                class='documentation'; materiality='documentation'; rationale='user/developer contract or provenance document; verify material claims against current code/tests' ;;
              var/*)
                class='committed-generated-artifact'; materiality='generated'; rationale='deterministic committed output; verify regeneration leaves tree unchanged' ;;
              Cargo.toml)
                class='rust-manifest'; materiality='critical-build'; rationale='authoritative package/dependency/compiler policy' ;;
              Cargo.lock)
                class='lockfile'; materiality='critical-build'; rationale='reproducible dependency resolution for --locked builds' ;;
              build.rs)
                class='build-script'; materiality='critical-build'; rationale='compile-time behavior and credential-embedding boundary' ;;
              install.sh)
                class='termux-installer'; materiality='critical-target'; rationale='public Termux source-install entrypoint and target bootstrap contract' ;;
              README.md|ARCHITECTURE.md|CHANGELOG.md)
                class='root-documentation'; materiality='documentation'; rationale='top-level user/architecture/history contract; verify live claims against implementation' ;;
              .gitignore)
                class='repository-policy'; materiality='supporting'; rationale='repository hygiene policy, including archive/secret/build-artifact exclusions' ;;
              *)
                class='UNCLASSIFIED'; materiality='unknown'; disposition='REVIEW'; rationale='no audit classification rule matched' ;;
            esac
            printf '%s\t%s\t%s\t%s\t%s\n' "$path" "$class" "$materiality" "$disposition" "$rationale" >> audit-manifest.tsv
          done < audit-files.txt

          rows=$(( $(wc -l < audit-manifest.tsv) - 1 ))
          unclassified=$(awk -F '\t' 'NR>1 && $2=="UNCLASSIFIED" {n++} END {print n+0}' audit-manifest.tsv)
          audit_only=$(awk -F '\t' 'NR>1 && $2=="audit-instrumentation" {n++} END {print n+0}' audit-manifest.tsv)
          baseline_n=$((n - audit_only))
          legacy=$(awk -F '\t' 'NR>1 && $2 ~ /^legacy-/ {n++} END {print n+0}' audit-manifest.tsv)
          active=$(awk -F '\t' 'NR>1 && $2=="active-rust" {n++} END {print n+0}' audit-manifest.tsv)
          tests=$(awk -F '\t' 'NR>1 && ($2=="integration-test" || $2=="test-fixture") {n++} END {print n+0}' audit-manifest.tsv)
          deploy=$(awk -F '\t' 'NR>1 && $2=="deployment-config" {n++} END {print n+0}' audit-manifest.tsv)

          echo "TRACKED_N=$n"
          echo "AUDIT_ONLY=$audit_only"
          echo "AUTHORITATIVE_BASELINE_N=$baseline_n"
          echo "MANIFEST_ROWS=$rows"
          echo "UNCLASSIFIED=$unclassified"
          echo "LEGACY_OR_PROVENANCE=$legacy"
          echo "ACTIVE_RUST=$active"
          echo "TESTS_AND_FIXTURES=$tests"
          echo "DEPLOYMENT_CONFIG=$deploy"
          echo '--- class counts ---'
          awk -F '\t' 'NR>1 {c[$2]++} END {for (k in c) print k, c[k]}' audit-manifest.tsv | sort
          echo '--- top-level counts ---'
          awk -F/ '{print $1}' audit-files.txt | sort | uniq -c | sort -nr

          test "$rows" -eq "$n"
          test "$unclassified" -eq 0
          test "$audit_only" -eq 1
          test "$(find legacy/hse-monolith-v1.41.0 -type f | wc -l | tr -d ' ')" -eq 1314
          test "$(find legacy/refactor-overlay-feef60a -type f | wc -l | tr -d ' ')" -eq 40

      - name: Active-tree hazard census
        shell: bash
        run: |
          set -euo pipefail
          echo '--- unsafe/todo/unimplemented/panic/unwrap/expect census (non-legacy Rust) ---'
          for needle in 'unsafe' 'TODO' 'FIXME' 'unimplemented!' 'todo!' 'panic!' '.unwrap(' '.expect('; do
            count=$(git grep -n -F "$needle" -- 'src/**/*.rs' 'src/*.rs' 'tests/*.rs' 2>/dev/null | wc -l || true)
            printf '%s\t%s\n' "$needle" "$count"
          done
          echo '--- zero-byte tracked files ---'
          while IFS= read -r f; do [ -s "$f" ] || echo "$f"; done < audit-files.txt
          echo '--- largest non-legacy tracked files ---'
          while IFS= read -r f; do
            case "$f" in legacy/*) continue;; esac
            printf '%s\t%s\n' "$(wc -c < "$f")" "$f"
          done < audit-files.txt | sort -nr | head -30

      - name: Build and full test gates
        shell: bash
        env:
          HUNTSMAN_HIBP_NO_EMBED: '1'
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --release --locked
          cargo test --locked
          cargo run --locked -- check
          git diff --exit-code -- var/

      - name: Repository key scan
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/scan-for-keys.sh \
            .github .gitignore ARCHITECTURE.md CHANGELOG.md Cargo.lock Cargo.toml README.md \
            build.rs deploy docs install.sh legacy src tests var

      - name: Upload audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-audit-manifest
          path: |
            audit-files.txt
            audit-manifest.tsv
          if-no-files-found: error
