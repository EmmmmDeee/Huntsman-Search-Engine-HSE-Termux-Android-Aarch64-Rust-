name: reconstruction-rustfmt

on:
  push:
    branches:
      - refactor/repository-reconstruction-2026-10-05

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: Canonical rustfmt
        run: cargo fmt --all
      - name: Commit rustfmt result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.rs' 'src/**/*.rs' 'tests/**/*.rs' 2>/dev/null || true
          git add tests/repository_hygiene.rs tests/archive_model.rs tests/legacy_reference.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(reconstruction): apply canonical rustfmt'
          git push
