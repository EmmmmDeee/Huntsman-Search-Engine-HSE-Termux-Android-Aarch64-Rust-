name: DeHashed credential or live-domain acceptance (manual)

# The production key is available only to a manually dispatched run of the
# reviewed default branch. Pull requests and branch pushes never receive it.
on:
  workflow_dispatch:
    inputs:
      run_real_domain_search:
        description: "Spend one DeHashed search credit testing telstra.com.au; never publish records"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dehashed-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  credential-probe:
    name: DeHashed v2 free probe or opt-in paid domain acceptance
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline probe contract and secret isolation
        run: |
          set -euo pipefail
          bash -n .github/scripts/dehashed-auth-diagnostic.sh
          bash -n tests/dehashed-auth-diagnostic.sh
          bash tests/dehashed-auth-diagnostic.sh
          bash -n scripts/dehashed-live-domain-acceptance.sh
          bash -n tests/dehashed-live-domain-acceptance.sh
          bash tests/dehashed-live-domain-acceptance.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.99"
      - name: Compile HUNTSMAN without provider secrets
        run: cargo build --locked --bin huntsman-recon
      - name: Probe DeHashed and optionally perform one paid real-domain search
        env:
          HUNTSMAN_DEHASHED_KEY: ${{ secrets.HUNTSMAN_DEHASHED_KEY || secrets.DEHASHED_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.run_real_domain_search }}" == "true" ]]; then
            # The paid search gives a conclusive entitlement result independently
            # of the free endpoint's potentially inconclusive response shape.
            bash scripts/dehashed-live-domain-acceptance.sh --allow-one-paid-search ./target/debug/huntsman-recon
          else
            bash .github/scripts/dehashed-auth-diagnostic.sh ./target/debug/huntsman-recon
          fi
