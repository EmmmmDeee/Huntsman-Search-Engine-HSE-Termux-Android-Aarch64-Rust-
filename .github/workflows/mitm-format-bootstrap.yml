name: MITM format bootstrap
on:
  pull_request:
    paths:
      - src/mitm_guard.rs
      - src/cli/mitm.rs
      - tests/mitm_cli.rs
      - .github/workflows/mitm-format-bootstrap.yml
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/mitm-guard-evidence-gated'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/mitm-guard-evidence-gated
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99"
          components: rustfmt
      - name: Apply the project formatter to new Rust only
        run: |
          rustfmt --edition 2024 src/mitm_guard.rs src/cli/mitm.rs tests/mitm_cli.rs
          git diff --exit-code -- src/mitm_guard.rs src/cli/mitm.rs tests/mitm_cli.rs
