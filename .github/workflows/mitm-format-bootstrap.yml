name: MITM format bootstrap
on:
  pull_request:
    paths:
      - src/mitm_guard.rs
      - src/cli/mitm.rs
      - tests/mitm_cli.rs
      - .github/workflows/mitm-format-bootstrap.yml
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/mitm-guard-evidence-gated'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/mitm-guard-evidence-gated
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.99"
          components: rustfmt
      - name: Apply the project formatter to new Rust only
        run: |
          rustfmt --edition 2024 src/mitm_guard.rs src/cli/mitm.rs tests/mitm_cli.rs
          if ! git diff --quiet -- src/mitm_guard.rs src/cli/mitm.rs tests/mitm_cli.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/mitm_guard.rs src/cli/mitm.rs tests/mitm_cli.rs
            git commit -m "Apply deterministic Rust formatting to MITM guard"
            git push origin HEAD:feature/mitm-guard-evidence-gated
          fi
