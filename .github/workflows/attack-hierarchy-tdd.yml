name: ATT&CK hierarchy TDD

on:
  pull_request:
    branches: [tdd/attack-hierarchy-base]

permissions:
  contents: read

jobs:
  hierarchy-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Run hierarchy reporting contract
        run: cargo test --locked --test attack_hierarchy_reporting -- --nocapture
