# GitLab host-only migration gate. Native Android/release acceptance remains on GitHub
# until a separately verified GitLab equivalent is implemented.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - verify

variables:
  GIT_DEPTH: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

msrv-gate:
  stage: verify
  image: rust:1.87-bookworm
  timeout: 90m
  script:
    - rustc --version
    - cargo run --locked -p xtask -- gate msrv

pinned-stable-gate:
  stage: verify
  image: rust:1.99-bookworm
  timeout: 90m
  script:
    - rustup component add rustfmt clippy
    - rustc --version
    - cargo run --locked -p xtask -- gate full
